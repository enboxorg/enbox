name: 'Setup Test Environment'
description: 'Setup Node.js, pnpm, and dependencies for testing'

inputs:
  package-name:
    description: 'Name of the package to test'
    required: true
  needs-dwn-server:
    description: 'Whether this test needs dwn-server running'
    required: false
    default: 'false'
  test-command:
    description: 'Test command to run (default: test:node)'
    required: false
    default: 'test:node'

runs:
  using: 'composite'
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 make g++ build-essential
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.x
        
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v3
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-
        
    - name: Install dependencies
      shell: bash
      run: |
        # Set environment to allow building native modules
        export npm_config_build_from_source=true
        export JOBS=max
        
        # If cache hit, just verify installation
        if [ "${{ steps.cache-node-modules.outputs.cache-hit }}" == "true" ]; then
          echo "::group::Using cached node_modules"
          echo "node_modules restored from cache"
          
          # Verify installation is intact
          pnpm install --frozen-lockfile --prefer-offline
          
          # Check native modules
          echo "Checking for native modules..."
          find node_modules/.pnpm -name "*.node" -type f | head -10
          echo "::endgroup::"
        else
          echo "::group::Installing dependencies"
          # Fresh install with native module builds
          pnpm install --frozen-lockfile
          echo "::endgroup::"
        fi
        
        # Verify better-sqlite3 is available
        echo "::group::Verifying better-sqlite3"
        if find node_modules/.pnpm -name "better_sqlite3.node" -type f | grep -q .; then
          echo "✅ better-sqlite3 native module found"
          find node_modules/.pnpm -name "better_sqlite3.node" -type f | head -5
        else
          echo "⚠️ better-sqlite3 native module not found, attempting rebuild..."
          
          # Try multiple approaches to rebuild
          export npm_config_build_from_source=true
          export FORCE_BUILD=true
          
          # Approach 1: Rebuild from root
          echo "Attempting rebuild from root..."
          pnpm rebuild better-sqlite3 || true
          
          # Approach 2: Rebuild from package directory
          if [ -d "packages/${{ inputs.package-name }}" ]; then
            echo "Attempting rebuild from package directory..."
            cd packages/${{ inputs.package-name }}
            pnpm rebuild better-sqlite3 || true
            cd ../..
          fi
          
          # Approach 3: Force reinstall just better-sqlite3
          if ! find node_modules/.pnpm -name "better_sqlite3.node" -type f | grep -q .; then
            echo "Force reinstalling better-sqlite3..."
            pnpm add -D better-sqlite3@8.7.0 --force || true
          fi
          
          # Final check
          if find node_modules/.pnpm -name "better_sqlite3.node" -type f | grep -q .; then
            echo "✅ better-sqlite3 native module rebuilt successfully"
          else
            echo "❌ Failed to build better-sqlite3 native module"
            echo "Checking better-sqlite3 directories:"
            find node_modules/.pnpm -name "better-sqlite3" -type d | head -10
            echo "Contents of better-sqlite3 build directories:"
            find node_modules/.pnpm/better-sqlite3*/node_modules/better-sqlite3 -name "build" -type d -exec ls -la {} \; 2>/dev/null || true
          fi
        fi
        echo "::endgroup::"
        
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        
    - name: Start dwn-server
      if: inputs.needs-dwn-server == 'true'
      shell: bash
      run: |
        echo "::group::Starting dwn-server"
        export DS_PORT=3000
        export DWN_BASE_URL=http://localhost:3000
        
        cd packages/dwn-server
        
        # Check if the server script exists
        if [ ! -f "dist/esm/src/main.js" ]; then
          echo "dwn-server not built, building now..."
          pnpm build:esm
        fi
        
        # Start server with explicit output
        echo "Starting dwn-server on port 3000..."
        pnpm server > ../../dwn-server.log 2>&1 &
        DWN_SERVER_PID=$!
        echo "DWN_SERVER_PID=$DWN_SERVER_PID" >> $GITHUB_ENV
        
        # Store PID for cleanup
        echo $DWN_SERVER_PID > ../../dwn-server.pid
        
        cd ../..
        
        # Wait for server to be ready with timeout
        echo "Waiting for dwn-server to be ready..."
        TIMEOUT=60
        ELAPSED=0
        
        while [ $ELAPSED -lt $TIMEOUT ]; do
          if curl -f -s http://localhost:3000/info >/dev/null 2>&1; then
            echo "✅ dwn-server is ready!"
            curl -s http://localhost:3000/info | jq . || true
            echo "::endgroup::"
            break
          fi
          
          # Check if process is still running
          if ! kill -0 $DWN_SERVER_PID 2>/dev/null; then
            echo "❌ dwn-server process died!"
            echo "Last 50 lines of dwn-server.log:"
            tail -50 dwn-server.log
            echo "::endgroup::"
            exit 1
          fi
          
          echo "Waiting for dwn-server... ($ELAPSED/$TIMEOUT seconds)"
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done
        
        if [ $ELAPSED -ge $TIMEOUT ]; then
          echo "❌ Timeout waiting for dwn-server!"
          echo "dwn-server.log contents:"
          cat dwn-server.log
          echo "::endgroup::"
          exit 1
        fi
        
    - name: Verify test environment
      shell: bash
      run: |
        echo "::group::Test environment verification"
        echo "Current directory: $(pwd)"
        echo "Node version: $(node --version)"
        echo "pnpm version: $(pnpm --version)"
        
        if [ "${{ inputs.needs-dwn-server }}" == "true" ]; then
          echo "dwn-server status:"
          if [ -f dwn-server.pid ]; then
            PID=$(cat dwn-server.pid)
            if kill -0 $PID 2>/dev/null; then
              echo "✅ dwn-server is running (PID: $PID)"
            else
              echo "❌ dwn-server is not running"
            fi
          else
            echo "❌ dwn-server.pid not found"
          fi
        fi
        echo "::endgroup::"
        
    - name: Run tests
      id: test
      shell: bash
      run: |
        cd packages/${{ inputs.package-name }}
        
        # Create test results directory
        mkdir -p test-results
        
        echo "::group::📦 Testing @enbox/${{ inputs.package-name }}"
        echo "Running: pnpm ${{ inputs.test-command }}"
        echo "::endgroup::"
        
        # Run tests and capture exit code
        set +e
        pnpm ${{ inputs.test-command }} 2>&1 | tee test-results/output.log
        TEST_EXIT_CODE=${PIPESTATUS[0]}
        set -e
        
        # Create summary
        if [ $TEST_EXIT_CODE -eq 0 ]; then
          echo "✅ Tests passed for @enbox/${{ inputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "test_status=passed" >> $GITHUB_OUTPUT
        else
          echo "❌ Tests failed for @enbox/${{ inputs.package-name }}" >> $GITHUB_STEP_SUMMARY
          echo "test_status=failed" >> $GITHUB_OUTPUT
          
          # Extract and display failed tests
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>Failed test output</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -100 test-results/output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
          
          # If dwn-server was needed, show its logs too
          if [ "${{ inputs.needs-dwn-server }}" == "true" ] && [ -f ../../dwn-server.log ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>dwn-server logs</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 ../../dwn-server.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi
        fi
        
        # Exit with the original test exit code
        exit $TEST_EXIT_CODE
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ inputs.package-name }}
        path: |
          packages/${{ inputs.package-name }}/test-results/
          dwn-server.log
        retention-days: 7
        
    - name: Stop dwn-server
      if: inputs.needs-dwn-server == 'true' && always()
      shell: bash
      run: |
        echo "::group::Stopping dwn-server"
        if [ -f dwn-server.pid ]; then
          PID=$(cat dwn-server.pid)
          if kill -0 $PID 2>/dev/null; then
            echo "Stopping dwn-server (PID: $PID)..."
            kill $PID || true
            sleep 2
            # Force kill if still running
            if kill -0 $PID 2>/dev/null; then
              echo "Force killing dwn-server..."
              kill -9 $PID || true
            fi
          fi
          rm -f dwn-server.pid
        fi
        
        # Also try the environment variable
        if [ ! -z "$DWN_SERVER_PID" ]; then
          kill $DWN_SERVER_PID 2>/dev/null || true
        fi
        echo "::endgroup::"