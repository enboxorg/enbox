name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  # Determine which apps have changes that need deploying
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      dwn-server: ${{ steps.filter.outputs.dwn-server }}
      dapp-demo: ${{ steps.filter.outputs.dapp-demo }}
      web-wallet: ${{ steps.filter.outputs.web-wallet }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dwn-server:
              - 'packages/dwn-server/**'
              - 'fly.toml'
            dapp-demo:
              - 'examples/dapp-demo'
              - 'deploy/dapp-demo/**'
              - 'deploy/nginx.conf'
            web-wallet:
              - 'examples/web-wallet'
              - 'deploy/web-wallet/**'
              - 'deploy/nginx.conf'

  deploy-dwn-server:
    name: Deploy DWN Server
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.dwn-server == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-dapp-demo:
    name: Deploy DApp Demo
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.dapp-demo == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config deploy/dapp-demo/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web-wallet:
    name: Deploy Web Wallet
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.web-wallet == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config deploy/web-wallet/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
