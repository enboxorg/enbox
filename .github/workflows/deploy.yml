name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  # Determine which apps have changes that need deploying
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      dwn-server: ${{ steps.filter.outputs.dwn-server }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dwn-server:
              - 'packages/dwn-server/**'
              - 'packages/dwn-sdk-js/**'
              - 'packages/dwn-sql-store/**'
              - 'packages/dwn-clients/**'
              - 'packages/common/**'
              - 'packages/crypto/**'
              - 'packages/dids/**'
              - 'build/**'
              - 'fly.toml'
              - '.dockerignore'
              - 'bun.lock'

  deploy-dwn-server:
    name: Deploy DWN Server
    runs-on: ubuntu-latest
    needs: [test, changes]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.dwn-server == 'true' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
