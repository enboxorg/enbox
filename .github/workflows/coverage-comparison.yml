name: Coverage Comparison

on:
  pull_request:
    branches: [ main ]

jobs:
  coverage-comparison:
    name: Compare Coverage
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      postgres-dwn-server:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8.15.0
        
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build packages
      run: pnpm build
      
    - name: Start dwn-server for PR tests
      run: |
        cd packages/dwn-server
        npm run build || true
        
        export DS_PORT=3000
        export DWN_BASE_URL=http://localhost:3000
        export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_EVENTS=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
        
        npm start &
        echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV
        
        for i in {1..30}; do
          if curl -f http://localhost:3000/info >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        
        cd ../..
      
    - name: Generate PR coverage
      run: |
        mkdir -p coverage-pr
        
        # Set environment variables for database connections
        export DB_HOST=localhost
        export DB_PORT=5432
        export DB_USER=root
        export DB_PASSWORD=dwn
        export DB_NAME=dwn
        export MYSQL_HOST=localhost
        export MYSQL_PORT=3306
        export MYSQL_USER=root
        export MYSQL_PASSWORD=dwn
        export MYSQL_DATABASE=dwn
        
        # Run tests for all packages using pnpm
        pnpm test:node || true
        
        # Copy coverage reports from each package
        for dir in packages/*; do
          if [ -d "$dir" ] && [ -d "$dir/coverage" ]; then
            pkg=$(basename "$dir")
            mkdir -p "coverage-pr/$pkg"
            cp -r "$dir/coverage/"* "coverage-pr/$pkg/" || true
          fi
        done
        
    - name: Checkout base branch
      run: |
        git fetch origin ${{ github.base_ref }}
        git checkout origin/${{ github.base_ref }}
        
    - name: Install base dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build base packages
      run: pnpm build
      
    - name: Stop previous dwn-server
      run: |
        if [ ! -z "$DWN_SERVER_PID" ]; then
          kill $DWN_SERVER_PID || true
        fi
        
    - name: Start dwn-server for base tests
      run: |
        cd packages/dwn-server
        npm run build || true
        
        export DS_PORT=3000
        export DWN_BASE_URL=http://localhost:3000
        export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_EVENTS=postgres://dwn_user:dwn_password@localhost:5433/dwn
        export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
        
        npm start &
        echo "DWN_SERVER_BASE_PID=$!" >> $GITHUB_ENV
        
        for i in {1..30}; do
          if curl -f http://localhost:3000/info >/dev/null 2>&1; then
            break
          fi
          sleep 2
        done
        
        cd ../..
      
    - name: Generate base coverage
      run: |
        mkdir -p coverage-base
        
        # Set environment variables for database connections
        export DB_HOST=localhost
        export DB_PORT=5432
        export DB_USER=root
        export DB_PASSWORD=dwn
        export DB_NAME=dwn
        export MYSQL_HOST=localhost
        export MYSQL_PORT=3306
        export MYSQL_USER=root
        export MYSQL_PASSWORD=dwn
        export MYSQL_DATABASE=dwn
        
        # Run tests for all packages using pnpm
        pnpm test:node || true
        
        # Copy coverage reports from each package
        for dir in packages/*; do
          if [ -d "$dir" ] && [ -d "$dir/coverage" ]; then
            pkg=$(basename "$dir")
            mkdir -p "coverage-base/$pkg"
            cp -r "$dir/coverage/"* "coverage-base/$pkg/" || true
          fi
        done
        
    - name: Compare coverage
      id: coverage-compare
      run: |
        echo "# Coverage Comparison Report" > coverage-report.md
        echo "" >> coverage-report.md
        echo "| Package | Base Coverage | PR Coverage | Change |" >> coverage-report.md
        echo "|---------|---------------|-------------|---------|" >> coverage-report.md
        
        failed=false
        
        for dir in packages/*; do
          if [ -d "$dir" ]; then
            pkg=$(basename "$dir")
            
            base_report="coverage-base/$pkg/cobertura-coverage.xml"
            pr_report="coverage-pr/$pkg/cobertura-coverage.xml"
            
            if [ -f "$pr_report" ]; then
              # Extract coverage from PR
              pr_coverage=$(python3 -c "import xml.etree.ElementTree as ET; import sys; tree = ET.parse(sys.argv[1]) if len(sys.argv) > 1 else None; root = tree.getroot() if tree else None; line_rate = float(root.get('line-rate', 0)) if root else 0; print(f'{line_rate * 100:.2f}')" "$pr_report" 2>/dev/null || echo "0.00")
              
              # Extract coverage from base
              if [ -f "$base_report" ]; then
                base_coverage=$(python3 -c "import xml.etree.ElementTree as ET; import sys; tree = ET.parse(sys.argv[1]) if len(sys.argv) > 1 else None; root = tree.getroot() if tree else None; line_rate = float(root.get('line-rate', 0)) if root else 0; print(f'{line_rate * 100:.2f}')" "$base_report" 2>/dev/null || echo "0.00")
              else
                base_coverage="N/A"
              fi
              
              # Calculate change
              if [ "$base_coverage" != "N/A" ]; then
                change=$(python3 -c "import sys; print(f'{float(sys.argv[1]) - float(sys.argv[2]):+.2f}')" "$pr_coverage" "$base_coverage")
                
                # Check if coverage decreased
                if python3 -c "import sys; exit(0 if float(sys.argv[1]) >= float(sys.argv[2]) else 1)" "$pr_coverage" "$base_coverage"; then
                  echo "| $pkg | $base_coverage% | $pr_coverage% | 🟢 $change% |" >> coverage-report.md
                else
                  echo "| $pkg | $base_coverage% | $pr_coverage% | 🔴 $change% |" >> coverage-report.md
                  echo "::error::Coverage decreased for $pkg: $base_coverage% → $pr_coverage%"
                  failed=true
                fi
              else
                echo "| $pkg | $base_coverage | $pr_coverage% | 🆕 New |" >> coverage-report.md
              fi
            fi
          fi
        done
        
        # Set output for PR comment
        echo "report<<EOF" >> $GITHUB_OUTPUT
        cat coverage-report.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
        if [ "$failed" = true ]; then
          echo "❌ Coverage check failed: Coverage decreased in one or more packages" >> coverage-report.md
          exit 1
        else
          echo "" >> coverage-report.md
          echo "✅ Coverage check passed: No coverage decrease detected" >> coverage-report.md
        fi
        
    - name: Comment PR
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const coverageReport = `${{ steps.coverage-compare.outputs.report }}`;
          
          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && comment.body.includes('Coverage Comparison Report')
          );
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: coverageReport
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: coverageReport
            });
          }
          
    - name: Cleanup dwn-server
      if: always()
      run: |
        if [ ! -z "$DWN_SERVER_BASE_PID" ]; then
          kill $DWN_SERVER_BASE_PID || true
        fi