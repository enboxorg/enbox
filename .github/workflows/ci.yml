name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-dwn-server:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm --recursive --stream --filter='./packages/*' build

      - name: Start Pkarr relay
        run: |
          docker run -d --name pkarr-relay -p 7527:15411 synonymsoft/pkarr pkarr-relay --testnet
          echo "Waiting for Pkarr relay..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7527/ >/dev/null 2>&1 || [ $? -eq 22 ]; then
              echo "Pkarr relay is ready"
              break
            fi
            sleep 2
          done

      - name: Start dwn-server
        run: |
          cd packages/dwn-server

          export DS_PORT=3000
          export DWN_BASE_URL=http://localhost:3000
          export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_EVENTS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527

          node dist/esm/src/main.js &
          echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for dwn-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/info >/dev/null 2>&1; then
              echo "dwn-server is ready"
              break
            fi
            sleep 2
          done

          cd ../..

      - name: Run tests
        run: |
          export DB_HOST=localhost
          export DB_PORT=5432
          export DB_USER=root
          export DB_PASSWORD=dwn
          export DB_NAME=dwn
          export MYSQL_HOST=localhost
          export MYSQL_PORT=3306
          export MYSQL_USER=root
          export MYSQL_PASSWORD=dwn
          export MYSQL_DATABASE=dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527

          pnpm --recursive --stream --no-bail --filter='./packages/*' test:node

      - name: Stop dwn-server
        if: always()
        run: |
          if [ -n "$DWN_SERVER_PID" ]; then
            kill "$DWN_SERVER_PID" || true
          fi
          docker rm -f pkarr-relay || true

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 7

  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: coverage-artifacts

      - name: Check coverage thresholds
        id: coverage-check
        run: |
          echo "## Coverage Report" > coverage-report.md
          echo "" >> coverage-report.md
          echo "| Package | Line Coverage | Status |" >> coverage-report.md
          echo "|---------|-------------|--------|" >> coverage-report.md

          failed=false
          threshold=80

          for report in coverage-artifacts/*/coverage/cobertura-coverage.xml; do
            [ -f "$report" ] || continue

            pkg=$(echo "$report" | sed 's|coverage-artifacts/\([^/]*\)/.*|\1|')

            coverage=$(python3 -c "
          import xml.etree.ElementTree as ET
          try:
              tree = ET.parse('$report')
              root = tree.getroot()
              print(f'{float(root.get(\"line-rate\", 0)) * 100:.1f}')
          except:
              print('0.0')
          ")

            if [ "$(echo "$coverage < $threshold" | bc -l)" = "1" ]; then
              echo "| $pkg | ${coverage}% | :x: Below ${threshold}% |" >> coverage-report.md
              echo "::error::Coverage for $pkg is ${coverage}%, below ${threshold}% threshold"
              failed=true
            else
              echo "| $pkg | ${coverage}% | :white_check_mark: |" >> coverage-report.md
            fi
          done

          echo "" >> coverage-report.md
          if [ "$failed" = true ]; then
            echo ":x: **Coverage check failed**: one or more packages are below the ${threshold}% threshold." >> coverage-report.md
          else
            echo ":white_check_mark: **All packages meet the ${threshold}% coverage threshold.**" >> coverage-report.md
          fi

          cat coverage-report.md >> $GITHUB_STEP_SUMMARY

          if [ "$failed" = true ]; then
            exit 1
          fi

      - name: Comment PR with coverage
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # Gate job for branch protection — require this to pass before merging
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [test, coverage]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed"
            exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::error::Coverage check failed"
            exit 1
          fi
          echo "All checks passed"
