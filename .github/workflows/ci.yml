name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new run is triggered on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.x
        
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    - name: Install dependencies with native builds
      run: |
        # Install dependencies without running scripts first
        pnpm install --frozen-lockfile --ignore-scripts
        
        # Now rebuild native dependencies
        # This will build better-sqlite3 and other native deps
        pnpm rebuild better-sqlite3 --config.build-from-source=true
        pnpm rebuild
        
    - name: Run linting
      run: pnpm lint
      
    - name: Build packages
      run: pnpm build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          packages/*/dist/
          packages/*/build/
          packages/*/generated/
          node_modules/.pnpm/better-sqlite3*/
        retention-days: 1

  # Test jobs - each package gets its own job for parallel execution
  test-common:
    name: Test @enbox/common
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: common

  test-crypto:
    name: Test @enbox/crypto
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: crypto

  test-dids:
    name: Test @enbox/dids
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dids

  test-dwn-sdk-js:
    name: Test @enbox/dwn-sdk-js
    runs-on: ubuntu-latest
    needs: build
    
    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dwn-sdk-js

  test-dwn-sql-store:
    name: Test @enbox/dwn-sql-store
    runs-on: ubuntu-latest
    needs: build
    
    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dwn-sql-store
        test-command: test

  test-agent:
    name: Test @enbox/agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: agent
        needs-dwn-server: true

  test-api:
    name: Test @enbox/api
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: api
        needs-dwn-server: true

  test-identity-agent:
    name: Test @enbox/identity-agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: identity-agent
        needs-dwn-server: true

  test-proxy-agent:
    name: Test @enbox/proxy-agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: proxy-agent
        needs-dwn-server: true

  test-user-agent:
    name: Test @enbox/user-agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: user-agent
        needs-dwn-server: true

  test-dwn-server:
    name: Test @enbox/dwn-server
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dwn-server
        test-command: test

  # Summary job to ensure all tests pass
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [
      build,
      test-common,
      test-crypto,
      test-dids,
      test-dwn-sdk-js,
      test-dwn-sql-store,
      test-agent,
      test-api,
      test-identity-agent,
      test-proxy-agent,
      test-user-agent,
      test-dwn-server
    ]
    if: always()
    steps:
      - name: Check if all jobs succeeded
        run: |
          # Check build job
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build job failed"
            exit 1
          fi
          
          # Check all test jobs
          test_jobs=(
            "test-common"
            "test-crypto"
            "test-dids"
            "test-dwn-sdk-js"
            "test-dwn-sql-store"
            "test-agent"
            "test-api"
            "test-identity-agent"
            "test-proxy-agent"
            "test-user-agent"
            "test-dwn-server"
          )
          
          for job in "${test_jobs[@]}"; do
            job_var="needs.${job//-/_}.result"
            job_result="${!job_var}"
            
            # Use GitHub Actions expression syntax
            case "$job" in
              test-common) result="${{ needs.test-common.result }}" ;;
              test-crypto) result="${{ needs.test-crypto.result }}" ;;
              test-dids) result="${{ needs.test-dids.result }}" ;;
              test-dwn-sdk-js) result="${{ needs.test-dwn-sdk-js.result }}" ;;
              test-dwn-sql-store) result="${{ needs.test-dwn-sql-store.result }}" ;;
              test-agent) result="${{ needs.test-agent.result }}" ;;
              test-api) result="${{ needs.test-api.result }}" ;;
              test-identity-agent) result="${{ needs.test-identity-agent.result }}" ;;
              test-proxy-agent) result="${{ needs.test-proxy-agent.result }}" ;;
              test-user-agent) result="${{ needs.test-user-agent.result }}" ;;
              test-dwn-server) result="${{ needs.test-dwn-server.result }}" ;;
            esac
            
            if [[ "$result" != "success" ]]; then
              echo "$job job failed with result: $result"
              exit 1
            fi
          done
          
          echo "✅ All CI checks passed!"