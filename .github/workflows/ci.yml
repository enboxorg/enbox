name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs when a new run is triggered on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build All Packages
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3 make g++ build-essential
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        
    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10.x
        
    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
        
    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-
          
    - name: Install dependencies with native builds
      run: |
        # Install dependencies without running scripts first
        pnpm install --frozen-lockfile --ignore-scripts
        
        # Now rebuild native dependencies
        # This will build better-sqlite3 and other native deps
        pnpm rebuild better-sqlite3 --config.build-from-source=true
        pnpm rebuild
        
        # Verify better-sqlite3 was built
        find node_modules/.pnpm -name "better_sqlite3.node" -type f | head -10
        
    - name: Run linting
      run: pnpm lint
      
    - name: Build packages
      run: pnpm build
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          packages/*/dist/
          packages/*/build/
          packages/*/generated/
          node_modules/.pnpm/better-sqlite3*/**/*.node
          node_modules/.pnpm/classic-level*/**/*.node
        retention-days: 1

  # Test jobs - each package gets its own job for parallel execution
  test-common:
    name: Test @enbox/common
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: common

  test-crypto:
    name: Test @enbox/crypto
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: crypto

  test-dids:
    name: Test @enbox/dids
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dids

  test-dwn-sdk-js:
    name: Test @enbox/dwn-sdk-js
    runs-on: ubuntu-latest
    needs: build
    
    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dwn-sdk-js

  test-dwn-sql-store:
    name: Test @enbox/dwn-sql-store
    runs-on: ubuntu-latest
    needs: build
    
    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dwn-sql-store
        test-command: test

  test-agent:
    name: Test @enbox/agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: agent
        needs-dwn-server: true

  test-api:
    name: Test @enbox/api
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: api
        needs-dwn-server: true

  test-identity-agent:
    name: Test @enbox/identity-agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: identity-agent
        needs-dwn-server: true

  test-proxy-agent:
    name: Test @enbox/proxy-agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: proxy-agent
        needs-dwn-server: true

  test-user-agent:
    name: Test @enbox/user-agent
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: user-agent
        needs-dwn-server: true

  test-dwn-server:
    name: Test @enbox/dwn-server
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup test environment
      uses: ./.github/actions/setup-test-env
      with:
        package-name: dwn-server
        test-command: test

  # Summary job to ensure all tests pass and create test report
  ci-success:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [
      build,
      test-common,
      test-crypto,
      test-dids,
      test-dwn-sdk-js,
      test-dwn-sql-store,
      test-agent,
      test-api,
      test-identity-agent,
      test-proxy-agent,
      test-user-agent,
      test-dwn-server
    ]
    if: always()
    steps:
      - name: Create Test Summary Report
        run: |
          echo "# 📊 CI Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Build status
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            echo "## 🏗️ Build: ✅ Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🏗️ Build: ❌ Failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Test results table
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # Individual test results
          test_failed=false
          
          # Common
          if [[ "${{ needs.test-common.result }}" == "success" ]]; then
            echo "| @enbox/common | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/common | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # Crypto
          if [[ "${{ needs.test-crypto.result }}" == "success" ]]; then
            echo "| @enbox/crypto | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/crypto | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # DIDs
          if [[ "${{ needs.test-dids.result }}" == "success" ]]; then
            echo "| @enbox/dids | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/dids | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # DWN SDK JS
          if [[ "${{ needs.test-dwn-sdk-js.result }}" == "success" ]]; then
            echo "| @enbox/dwn-sdk-js | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/dwn-sdk-js | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # DWN SQL Store
          if [[ "${{ needs.test-dwn-sql-store.result }}" == "success" ]]; then
            echo "| @enbox/dwn-sql-store | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/dwn-sql-store | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # Agent
          if [[ "${{ needs.test-agent.result }}" == "success" ]]; then
            echo "| @enbox/agent | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/agent | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # API
          if [[ "${{ needs.test-api.result }}" == "success" ]]; then
            echo "| @enbox/api | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/api | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # Identity Agent
          if [[ "${{ needs.test-identity-agent.result }}" == "success" ]]; then
            echo "| @enbox/identity-agent | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/identity-agent | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # Proxy Agent
          if [[ "${{ needs.test-proxy-agent.result }}" == "success" ]]; then
            echo "| @enbox/proxy-agent | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/proxy-agent | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # User Agent
          if [[ "${{ needs.test-user-agent.result }}" == "success" ]]; then
            echo "| @enbox/user-agent | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/user-agent | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          # DWN Server
          if [[ "${{ needs.test-dwn-server.result }}" == "success" ]]; then
            echo "| @enbox/dwn-server | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| @enbox/dwn-server | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            test_failed=true
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "## ❌ CI Failed: Build failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          elif [[ "$test_failed" == "true" ]]; then
            echo "## ❌ CI Failed: One or more tests failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the individual test jobs above for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "## ✅ All CI checks passed!" >> $GITHUB_STEP_SUMMARY
          fi