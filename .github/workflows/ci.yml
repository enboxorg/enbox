name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Detect whether source code changed. Docs-only PRs skip the entire pipeline
  # but the ci-passed gate job still reports success (required for branch protection).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      src: ${{ steps.src-filter.outputs.src }}
      needs_common_crypto: ${{ steps.propagate.outputs.needs_common_crypto }}
      needs_lightweight: ${{ steps.propagate.outputs.needs_lightweight }}
      needs_dids: ${{ steps.propagate.outputs.needs_dids }}
      needs_dwn_sdk: ${{ steps.propagate.outputs.needs_dwn_sdk }}
      needs_dwn_clients: ${{ steps.propagate.outputs.needs_dwn_clients }}
      needs_dwn_sql_store: ${{ steps.propagate.outputs.needs_dwn_sql_store }}
      needs_dwn_server: ${{ steps.propagate.outputs.needs_dwn_server }}
      needs_agent: ${{ steps.propagate.outputs.needs_agent }}
      needs_auth: ${{ steps.propagate.outputs.needs_auth }}
      needs_api: ${{ steps.propagate.outputs.needs_api }}
      needs_agent_api_group: ${{ steps.propagate.outputs.needs_agent_api_group }}
      needs_browser_tests: ${{ steps.propagate.outputs.needs_browser_tests }}
      needs_e2e: ${{ steps.propagate.outputs.needs_e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Two filter steps: 'src' needs predicate-quantifier 'every' so that
      # negation patterns (e.g. !**/*.md) work correctly.  Per-package filters
      # need the default 'some' (match ANY pattern) since each filter lists
      # multiple inclusion globs for the same package.
      - name: Check for source changes
        uses: dorny/paths-filter@v3
        id: src-filter
        with:
          base: main
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!**/LICENSE'
              - '!**/CODE_OF_CONDUCT*'
              - '!docs/**'
              - '!.changeset/**'

      - name: Detect per-package changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            workspace:
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'turbo.json'
              - 'eslint.config.cjs'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - 'build/**'

            common-crypto:
              - 'packages/common/src/**'
              - 'packages/common/tests/**'
              - 'packages/common/package.json'
              - 'packages/common/tsconfig.json'
              - 'packages/common/vitest*.config.*'
              - 'packages/crypto/src/**'
              - 'packages/crypto/tests/**'
              - 'packages/crypto/package.json'
              - 'packages/crypto/tsconfig.json'
              - 'packages/crypto/vitest*.config.*'

            dids:
              - 'packages/dids/src/**'
              - 'packages/dids/tests/**'
              - 'packages/dids/package.json'
              - 'packages/dids/tsconfig.json'
              - 'packages/dids/vitest*.config.*'

            dwn-sdk:
              - 'packages/dwn-sdk-js/src/**'
              - 'packages/dwn-sdk-js/tests/**'
              - 'packages/dwn-sdk-js/json-schemas/**'
              - 'packages/dwn-sdk-js/build/**'
              - 'packages/dwn-sdk-js/package.json'
              - 'packages/dwn-sdk-js/tsconfig.json'
              - 'packages/dwn-sdk-js/vitest*.config.*'

            dwn-clients:
              - 'packages/dwn-clients/src/**'
              - 'packages/dwn-clients/tests/**'
              - 'packages/dwn-clients/package.json'
              - 'packages/dwn-clients/tsconfig.json'
              - 'packages/dwn-clients/vitest*.config.*'

            dwn-sql-store:
              - 'packages/dwn-sql-store/src/**'
              - 'packages/dwn-sql-store/tests/**'
              - 'packages/dwn-sql-store/package.json'
              - 'packages/dwn-sql-store/tsconfig.json'
              - 'packages/dwn-sql-store/vitest*.config.*'

            dwn-server:
              - 'packages/dwn-server/src/**'
              - 'packages/dwn-server/tests/**'
              - 'packages/dwn-server/package.json'
              - 'packages/dwn-server/tsconfig.json'
              - 'packages/dwn-server/vitest*.config.*'

            agent:
              - 'packages/agent/src/**'
              - 'packages/agent/tests/**'
              - 'packages/agent/package.json'
              - 'packages/agent/tsconfig.json'
              - 'packages/agent/vitest*.config.*'

            auth:
              - 'packages/auth/src/**'
              - 'packages/auth/tests/**'
              - 'packages/auth/package.json'
              - 'packages/auth/tsconfig.json'
              - 'packages/auth/vitest*.config.*'

            api:
              - 'packages/api/src/**'
              - 'packages/api/tests/**'
              - 'packages/api/package.json'
              - 'packages/api/tsconfig.json'
              - 'packages/api/vitest*.config.*'

            protocols:
              - 'packages/protocols/src/**'
              - 'packages/protocols/tests/**'
              - 'packages/protocols/package.json'
              - 'packages/protocols/tsconfig.json'

            browser-pkg:
              - 'packages/browser/src/**'
              - 'packages/browser/tests/**'
              - 'packages/browser/package.json'
              - 'packages/browser/tsconfig.json'
              - 'packages/browser/vitest*.config.*'

      - name: Propagate changes through dependency graph
        id: propagate
        run: |
          # Convert filter outputs to shell booleans
          workspace="${{ steps.filter.outputs.workspace }}"
          common_crypto="${{ steps.filter.outputs.common-crypto }}"
          dids="${{ steps.filter.outputs.dids }}"
          dwn_sdk="${{ steps.filter.outputs.dwn-sdk }}"
          dwn_clients="${{ steps.filter.outputs.dwn-clients }}"
          dwn_sql_store="${{ steps.filter.outputs.dwn-sql-store }}"
          dwn_server="${{ steps.filter.outputs.dwn-server }}"
          agent="${{ steps.filter.outputs.agent }}"
          auth="${{ steps.filter.outputs.auth }}"
          api="${{ steps.filter.outputs.api }}"
          protocols="${{ steps.filter.outputs.protocols }}"
          browser_pkg="${{ steps.filter.outputs.browser-pkg }}"

          # Propagate down the dependency graph
          needs_common_crypto=$( [ "$workspace" = "true" ] || [ "$common_crypto" = "true" ] && echo true || echo false )
          needs_dids=$( [ "$needs_common_crypto" = "true" ] || [ "$dids" = "true" ] && echo true || echo false )
          needs_dwn_sdk=$( [ "$needs_dids" = "true" ] || [ "$dwn_sdk" = "true" ] && echo true || echo false )
          needs_dwn_clients=$( [ "$needs_dwn_sdk" = "true" ] || [ "$dwn_clients" = "true" ] && echo true || echo false )
          needs_dwn_sql_store=$( [ "$needs_dwn_sdk" = "true" ] || [ "$dwn_sql_store" = "true" ] && echo true || echo false )
          needs_dwn_server=$( [ "$needs_dwn_sdk" = "true" ] || [ "$needs_dwn_clients" = "true" ] || [ "$needs_dwn_sql_store" = "true" ] || [ "$dwn_server" = "true" ] && echo true || echo false )
          needs_agent=$( [ "$needs_dids" = "true" ] || [ "$needs_dwn_sdk" = "true" ] || [ "$needs_dwn_clients" = "true" ] || [ "$agent" = "true" ] && echo true || echo false )
          needs_auth=$( [ "$needs_agent" = "true" ] || [ "$auth" = "true" ] && echo true || echo false )
          needs_api=$( [ "$needs_agent" = "true" ] || [ "$needs_auth" = "true" ] || [ "$api" = "true" ] && echo true || echo false )
          needs_lightweight=$( [ "$needs_common_crypto" = "true" ] || [ "$needs_auth" = "true" ] && echo true || echo false )
          needs_agent_api_group=$( [ "$needs_dids" = "true" ] || [ "$needs_agent" = "true" ] || [ "$needs_auth" = "true" ] || [ "$needs_api" = "true" ] || [ "$dwn_clients" = "true" ] || [ "$protocols" = "true" ] && echo true || echo false )
          needs_browser_tests=$( [ "$needs_common_crypto" = "true" ] || [ "$needs_dids" = "true" ] || [ "$needs_dwn_sdk" = "true" ] || [ "$needs_agent" = "true" ] || [ "$needs_api" = "true" ] || [ "$browser_pkg" = "true" ] && echo true || echo false )
          needs_e2e=$( [ "$needs_agent" = "true" ] && echo true || echo false )

          # Write outputs
          {
            echo "needs_common_crypto=$needs_common_crypto"
            echo "needs_lightweight=$needs_lightweight"
            echo "needs_dids=$needs_dids"
            echo "needs_dwn_sdk=$needs_dwn_sdk"
            echo "needs_dwn_clients=$needs_dwn_clients"
            echo "needs_dwn_sql_store=$needs_dwn_sql_store"
            echo "needs_dwn_server=$needs_dwn_server"
            echo "needs_agent=$needs_agent"
            echo "needs_auth=$needs_auth"
            echo "needs_api=$needs_api"
            echo "needs_agent_api_group=$needs_agent_api_group"
            echo "needs_browser_tests=$needs_browser_tests"
            echo "needs_e2e=$needs_e2e"
          } >> "$GITHUB_OUTPUT"

          echo "Change detection results:"
          echo "  common_crypto=$needs_common_crypto dids=$needs_dids dwn_sdk=$needs_dwn_sdk"
          echo "  dwn_clients=$needs_dwn_clients dwn_sql_store=$needs_dwn_sql_store dwn_server=$needs_dwn_server"
          echo "  agent=$needs_agent auth=$needs_auth api=$needs_api"
          echo "  agent_api_group=$needs_agent_api_group browser=$needs_browser_tests e2e=$needs_e2e"

  # ---------------------------------------------------------------------------
  # Lint: runs in parallel with build for fast feedback (no build needed —
  # ESLint uses project: true which resolves .ts source files via tsconfig).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.src == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  # ---------------------------------------------------------------------------
  # Build: runs in parallel with lint, produces workspace-build artifact for
  # downstream test jobs.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.src == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: workspace-build
          path: packages/*/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Lightweight packages: common, crypto (no external services needed)
  # ---------------------------------------------------------------------------
  test-lightweight:
    name: 'Test: common / crypto / auth'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [build, changes]
    if: needs.changes.outputs.needs_lightweight == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Run tests with coverage
        run: |
          bun run --filter @enbox/common  test:node:coverage
          bun run --filter @enbox/crypto  test:node:coverage
          bun run --filter @enbox/auth    test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/common/coverage coverage-staging/packages/crypto/coverage coverage-staging/packages/auth/coverage
          cp packages/common/coverage/lcov.info coverage-staging/packages/common/coverage/lcov.info 2>/dev/null || true
          cp packages/crypto/coverage/lcov.info coverage-staging/packages/crypto/coverage/lcov.info 2>/dev/null || true
          cp packages/auth/coverage/lcov.info coverage-staging/packages/auth/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lightweight
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # DWN SDK: large test suite, but no external services (LevelDB in-process)
  # ---------------------------------------------------------------------------
  test-dwn-sdk:
    name: 'Test: dwn-sdk-js'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [build, changes]
    if: needs.changes.outputs.needs_dwn_sdk == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Run tests with coverage
        run: bun run --filter @enbox/dwn-sdk-js test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/dwn-sdk-js/coverage
          cp packages/dwn-sdk-js/coverage/lcov.info coverage-staging/packages/dwn-sdk-js/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dwn-sdk
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # dids + Agent + API: need a live Pkarr relay and dwn-server (backed by Postgres)
  # ---------------------------------------------------------------------------
  test-agent-api:
    name: 'Test: dids / agent / api'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [build, changes]
    if: needs.changes.outputs.needs_agent_api_group == 'true'

    services:
      postgres-dwn-server:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Link @enbox/protocols for api tests
        run: |
          mkdir -p packages/api/node_modules/@enbox
          ln -sf ../../../protocols packages/api/node_modules/@enbox/protocols

      - name: Start Pkarr relay
        run: |
          docker run -d --name pkarr-relay -p 7527:15411 synonymsoft/pkarr-relay pkarr-relay --testnet
          echo "Waiting for Pkarr relay..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7527/ >/dev/null 2>&1 || [ $? -eq 22 ]; then
              echo "Pkarr relay is ready"
              break
            fi
            sleep 2
          done

      - name: Start dwn-server
        run: |
          export DS_PORT=3000
          export DWN_BASE_URL=http://localhost:3000
          export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          # The DWN server itself talks to the local Pkarr relay; opt in to private gateways for
          # this dev/CI process. Production deployments leave this unset.
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          export DWN_RATE_LIMIT_REQUESTS_PER_SECOND=0
          export DWN_RATE_LIMIT_TENANT_REQUESTS_PER_SECOND=0

          bun packages/dwn-server/dist/esm/src/main.js &
          echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for dwn-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/info >/dev/null 2>&1; then
              echo "dwn-server is ready"
              break
            fi
            sleep 2
          done

      - name: Run tests with coverage
        run: |
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          # Opt-in for the test process so the agent / DWN can talk to the local Pkarr relay
          # without each call site having to pass `allowPrivateGatewayUri: true`.
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          bun run --filter @enbox/dids         test:node:coverage
          bun run --filter @enbox/dwn-clients  test:node:coverage
          bun run --filter @enbox/agent        test:node:coverage
          bun run --filter @enbox/api          test:node:coverage
          bun run --filter @enbox/browser      test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/dids/coverage coverage-staging/packages/dwn-clients/coverage coverage-staging/packages/agent/coverage coverage-staging/packages/api/coverage coverage-staging/packages/browser/coverage
          cp packages/dids/coverage/lcov.info coverage-staging/packages/dids/coverage/lcov.info 2>/dev/null || true
          cp packages/dwn-clients/coverage/lcov.info coverage-staging/packages/dwn-clients/coverage/lcov.info 2>/dev/null || true
          cp packages/agent/coverage/lcov.info coverage-staging/packages/agent/coverage/lcov.info 2>/dev/null || true
          cp packages/api/coverage/lcov.info coverage-staging/packages/api/coverage/lcov.info 2>/dev/null || true
          cp packages/browser/coverage/lcov.info coverage-staging/packages/browser/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-api
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: |
          if [ -n "$DWN_SERVER_PID" ]; then
            kill "$DWN_SERVER_PID" || true
          fi
          docker rm -f pkarr-relay || true

  # ---------------------------------------------------------------------------
  # E2E: long-running sync integration tests (heartbeat, convergence)
  # ---------------------------------------------------------------------------

  test-e2e:
    name: 'Test: e2e (long-running)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, changes]
    if: needs.changes.outputs.needs_e2e == 'true'

    services:
      postgres-e2e:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Start Pkarr relay
        run: |
          docker run -d --name pkarr-relay -p 7527:15411 synonymsoft/pkarr-relay pkarr-relay --testnet
          echo "Waiting for Pkarr relay..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7527/ >/dev/null 2>&1 || [ $? -eq 22 ]; then
              echo "Pkarr relay is ready"
              break
            fi
            sleep 2
          done

      - name: Start dwn-server
        run: |
          export DS_PORT=3000
          export DWN_BASE_URL=http://localhost:3000
          export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          export DWN_RATE_LIMIT_REQUESTS_PER_SECOND=0
          export DWN_RATE_LIMIT_TENANT_REQUESTS_PER_SECOND=0

          bun packages/dwn-server/dist/esm/src/main.js &
          echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for dwn-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/info >/dev/null 2>&1; then
              echo "dwn-server is ready"
              break
            fi
            sleep 2
          done

      - name: Run e2e tests
        run: |
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          bun run --filter @enbox/agent test:e2e

      - name: Stop services
        if: always()
        run: |
          if [ -n "$DWN_SERVER_PID" ]; then
            kill "$DWN_SERVER_PID" || true
          fi
          docker rm -f pkarr-relay || true

  # ---------------------------------------------------------------------------
  # SQL Store: needs Postgres + MySQL for dialect-specific tests
  # ---------------------------------------------------------------------------
  test-sql-store:
    name: 'Test: dwn-sql-store'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [build, changes]
    if: needs.changes.outputs.needs_dwn_sql_store == 'true'

    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          # Wait for MinIO to be ready.
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Run tests with coverage
        env:
          S3_ENDPOINT: http://localhost:9000
        run: bun run --filter @enbox/dwn-sql-store test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/dwn-sql-store/coverage
          cp packages/dwn-sql-store/coverage/lcov.info coverage-staging/packages/dwn-sql-store/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sql-store
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # DWN Server: self-contained tests (SQLite in-memory, no external services)
  # ---------------------------------------------------------------------------
  test-dwn-server:
    name: 'Test: dwn-server'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, changes]
    if: needs.changes.outputs.needs_dwn_server == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -m 8222
          for i in $(seq 1 30); do
            if wget -q --spider http://localhost:8222/healthz 2>/dev/null; then
              echo "NATS is ready"
              break
            fi
            sleep 1
          done

      - name: Run tests with coverage
        run: bun run --filter @enbox/dwn-server test:node:coverage
        env:
          NATS_URL: nats://localhost:4222

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/dwn-server/coverage
          cp packages/dwn-server/coverage/lcov.info coverage-staging/packages/dwn-server/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dwn-server
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Coverage (Node): merge all LCOV files (node + browser) for SonarCloud.
  # ---------------------------------------------------------------------------
  coverage-node:
    name: 'Coverage: Node'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    needs: [changes, test-lightweight, test-dwn-sdk, test-agent-api, test-e2e, test-sql-store, test-dwn-server, test-browser]
    # Run when at least one test job actually ran (node or browser)
    if: >-
      always() && !cancelled() && needs.changes.outputs.src == 'true' &&
      (needs.test-lightweight.result == 'success' || needs.test-dwn-sdk.result == 'success' ||
       needs.test-agent-api.result == 'success' || needs.test-sql-store.result == 'success' ||
       needs.test-dwn-server.result == 'success' || needs.test-browser.result == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Download node coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .
          merge-multiple: true

      - name: Merge LCOV coverage
        run: bun run coverage:merge:reports

      - name: Upload merged coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage/merged/
          retention-days: 1
          if-no-files-found: error

      - name: Build coverage badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          shopt -s nullglob

          parse_lcov() {
            local lcov_file="$1"
            local total_lf=0 total_lh=0 in_src=false

            while IFS= read -r line; do
              case "$line" in
                SF:src/*|SF:*/src/*) in_src=true ;;
                SF:*) in_src=false ;;
                LF:*)
                  if [ "$in_src" = true ]; then
                    total_lf=$((total_lf + ${line#LF:}))
                  fi
                  ;;
                LH:*)
                  if [ "$in_src" = true ]; then
                    total_lh=$((total_lh + ${line#LH:}))
                  fi
                  ;;
              esac
            done < "$lcov_file"

            if [ "$total_lf" -gt 0 ]; then
              awk "BEGIN { printf \"%.1f\", ($total_lh / $total_lf) * 100 }"
            else
              echo "0.0"
            fi
          }

          badge_color_for() {
            local cov="$1"

            if [ "$(echo "$cov >= 90" | bc -l)" = "1" ]; then
              echo "brightgreen"
            elif [ "$(echo "$cov >= 80" | bc -l)" = "1" ]; then
              echo "green"
            elif [ "$(echo "$cov >= 70" | bc -l)" = "1" ]; then
              echo "yellowgreen"
            elif [ "$(echo "$cov >= 60" | bc -l)" = "1" ]; then
              echo "yellow"
            else
              echo "red"
            fi
          }

          found_any=false
          mkdir -p coverage-badges

          for lcov_file in packages/*/coverage/lcov.info; do
            found_any=true
            pkg=$(basename "$(dirname "$(dirname "$lcov_file")")")
            coverage=$(parse_lcov "$lcov_file")
            badge_color=$(badge_color_for "$coverage")

            printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
              "$coverage" "$badge_color" > "coverage-badges/${pkg}.json"
          done

          if [ "$found_any" = false ]; then
            echo "::warning::No coverage artifacts found for badge update"
          fi

      - name: Update coverage badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "::warning::GIST_TOKEN not set — skipping badge update"
            exit 0
          fi

          if ! compgen -G "coverage-badges/*.json" > /dev/null; then
            echo "No coverage badges generated; skipping badge update"
            exit 0
          fi

          GIST_ID="02d15f39a46173a612a8862ec6d7cfcf"

          payload='{"files":{'
          first=true
          for badge_file in coverage-badges/*.json; do
            [ -f "$badge_file" ] || continue
            filename=$(basename "$badge_file")
            content=$(cat "$badge_file")
            if [ "$first" = true ]; then
              first=false
            else
              payload+=','
            fi
            escaped=$(printf '%s' "$content" | jq -Rs .)
            payload+="\"$filename\":{\"content\":$escaped}"
            echo "  Badge: $filename -> $content"
          done
          payload+='}}'

          echo "Updating Gist with all badges..."
          response=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "$payload")

          http_code=$(echo "$response" | tail -1)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Coverage badges updated (HTTP $http_code)"
          else
            echo "::warning::Failed to update Gist (HTTP $http_code)"
            echo "$response" | head -5
          fi

  # ---------------------------------------------------------------------------
  # Browser tests: run Vitest browser mode with Playwright.
  #
  # Two-dimensional matrix: shard (package group) × browser.  Each cell runs
  # a single browser so (a) browsers execute in parallel and (b) coverage is
  # collected per-browser for the merged SonarCloud LCOV artifact.
  #
  # Trade-off: 9 jobs instead of 3, but each job only installs one Playwright
  # browser (~20s) and runs ~1/3 the tests, so wall-clock time drops from
  # ~3 min (old 3-shard, 3-browser sequential) to ~1 min.
  # ---------------------------------------------------------------------------
  test-browser:
    name: 'Test: Browser (${{ matrix.shard.name }} / ${{ matrix.browser }})'
    runs-on: ubuntu-latest
    timeout-minutes: 21
    needs: [build, changes]
    if: needs.changes.outputs.needs_browser_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Shard 1 — crypto: 25 browser test files
          - name: crypto
            packages: '@enbox/common @enbox/crypto'
            coverage-dirs: common crypto
          # Shard 2 — dwn-sdk-js: 25 browser test files
          - name: dwn-sdk-js
            packages: '@enbox/dwn-sdk-js'
            coverage-dirs: dwn-sdk-js
          # Shard 3 — remaining: dids(11) + browser(1) + agent(3) + api(1) = 16 files
          - name: dids-agent-api
            packages: '@enbox/dids @enbox/browser @enbox/agent @enbox/api'
            coverage-dirs: dids browser agent api
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Cache Playwright browser & system deps
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-cache
          # v4 suffix busts stale caches after Ubuntu runner package revs
          # created exact-version Mesa dependency skew for WebKit.
          key: ${{ runner.os }}-playwright-v4-${{ matrix.browser }}-${{ hashFiles('package.json') }}

      - name: Install Playwright system deps (from cache)
        # On cache hit the .deb files are already saved in ~/playwright-apt-cache.
        # Install them directly with dpkg — no network needed, takes ~5s.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          if [ -d ~/playwright-apt-cache ] && ls ~/playwright-apt-cache/*.deb 1>/dev/null 2>&1; then
            echo "Installing $(ls ~/playwright-apt-cache/*.deb | wc -l) cached .deb packages"
            sudo dpkg -i ~/playwright-apt-cache/*.deb || true
            sudo apt-get update -qq
            sudo apt-get install -f -y
          fi

      - name: Install Playwright system deps (fresh)
        # Most Playwright deps are already on the runner image. Firefox/WebKit
        # need a handful of extra font packages (fonts-ipafont-gothic,
        # fonts-wqy-zenhei, etc.) that are 3-7 MB each and download at
        # ~50 KB/s from Azure apt mirrors — often stalling for minutes.
        #
        # We snapshot /var/cache/apt/archives before and after so we only
        # cache the .deb files that Playwright actually installed — not the
        # hundreds of pre-existing system packages.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          ls /var/cache/apt/archives/*.deb 2>/dev/null | sort > /tmp/apt-before.txt || true
          sudo apt-get update -qq
          bunx playwright install-deps ${{ matrix.browser }}
          mkdir -p ~/playwright-apt-cache
          comm -13 /tmp/apt-before.txt <(ls /var/cache/apt/archives/*.deb 2>/dev/null | sort) \
            | xargs -I{} cp {} ~/playwright-apt-cache/ 2>/dev/null || true
          echo "Cached $(ls ~/playwright-apt-cache/*.deb 2>/dev/null | wc -l) Playwright .deb packages"
        timeout-minutes: 15

      - name: Install Playwright browser
        # playwright@1.45.3 is pinned in root devDependencies to match the
        # version resolved for @vitest/browser-playwright's peer dependency.
        # On cache hit the binary is already present — this is a no-op.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: bunx playwright install ${{ matrix.browser }}

      - name: Run browser tests with coverage
        id: browser-tests
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
        # Coverage is collected even when some tests fail. Use continue-on-error
        # so the staging/upload steps always run, then re-check the exit code in
        # the final step to fail the job if tests actually broke.
        continue-on-error: true
        run: |
          # Firefox's ESM loader can transiently crash with "error loading
          # dynamically imported module" (affects ~14% of runs, random test
          # file each time).  Vitest's test-level retry cannot recover from
          # file-level import failures, so we retry the entire vitest
          # invocation once per package when running Firefox.
          max_attempts=1
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            max_attempts=2
          fi

          exit_code=0
          for pkg in ${{ matrix.shard.packages }}; do
            attempt=1
            pkg_passed=false
            while [ $attempt -le $max_attempts ]; do
              if bun run --filter "$pkg" test:browser:coverage -- --browser.connectTimeout=120000; then
                pkg_passed=true
                break
              fi
              if [ $attempt -lt $max_attempts ]; then
                echo "::warning::Browser tests for $pkg failed on attempt $attempt — retrying…"
              fi
              attempt=$((attempt + 1))
            done
            if [ "$pkg_passed" = false ]; then
              exit_code=1
            fi
          done
          exit $exit_code

      - name: Stage browser coverage
        if: always()
        run: |
          for dir in ${{ matrix.shard.coverage-dirs }}; do
            mkdir -p "coverage-staging/packages/${dir}/coverage-browser-${{ matrix.browser }}"
            cp "packages/${dir}/coverage-browser-${{ matrix.browser }}/lcov.info" \
               "coverage-staging/packages/${dir}/coverage-browser-${{ matrix.browser }}/lcov.info" 2>/dev/null || true
          done

      - name: Upload browser coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-browser-${{ matrix.shard.name }}-${{ matrix.browser }}
          path: coverage-staging/
          if-no-files-found: warn

      - name: Fail if browser tests failed
        if: always() && steps.browser-tests.outcome == 'failure'
        run: |
          echo "::error::Browser tests failed in shard '${{ matrix.shard.name }}' / ${{ matrix.browser }} (coverage was still collected)"
          exit 1

  # ---------------------------------------------------------------------------
  # SonarCloud: consume the merged LCOV artifact and publish analysis results.
  # The job activates once SONAR_PROJECT_KEY / SONAR_ORG repo vars are set.
  # Quality gate is enforced (blocks PRs that fail the SonarCloud QG).
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, coverage-node]
    # Run after coverage finishes; OK if coverage was skipped
    if: >-
      always() && !cancelled() &&
      needs.changes.outputs.src == 'true' &&
      vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORG != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Sonar cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('sonar-project.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Download merged coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-merged
          path: coverage/merged

      - name: Validate SonarCloud secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Set the SONAR_TOKEN repository secret before enabling SonarCloud scanning"
            exit 1
          fi

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Quality gate enforcement only on PRs (new code period).
          # Main branch pushes run the scan for analysis but don't block
          # on pre-existing quality gate failures.
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------------------
  # Gate job for branch protection — always runs so required checks pass even
  # when the pipeline is skipped (e.g. docs-only changes).
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, lint, build, test-lightweight, test-dwn-sdk, test-agent-api, test-e2e, test-sql-store, test-dwn-server, test-browser, coverage-node, sonarcloud]
    if: always()
    steps:
      - name: Check results
        run: |
          # Docs-only change — nothing to test
          if [ "${{ needs.changes.outputs.src }}" != "true" ]; then
            echo "Skipped: docs-only change"
            exit 0
          fi

          # Lint and build must always succeed when src changed
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build failed"
            exit 1
          fi

          # Test jobs: required when they run, OK to skip (no relevant changes)
          if [ "${{ needs.test-lightweight.result }}" != "success" ] && [ "${{ needs.test-lightweight.result }}" != "skipped" ]; then
            echo "::error::test-lightweight failed"
            exit 1
          fi
          if [ "${{ needs.test-dwn-sdk.result }}" != "success" ] && [ "${{ needs.test-dwn-sdk.result }}" != "skipped" ]; then
            echo "::error::test-dwn-sdk failed"
            exit 1
          fi
          if [ "${{ needs.test-agent-api.result }}" != "success" ] && [ "${{ needs.test-agent-api.result }}" != "skipped" ]; then
            echo "::error::test-agent-api failed"
            exit 1
          fi
          if [ "${{ needs.test-e2e.result }}" != "success" ] && [ "${{ needs.test-e2e.result }}" != "skipped" ]; then
            echo "::error::test-e2e failed"
            exit 1
          fi
          if [ "${{ needs.test-sql-store.result }}" != "success" ] && [ "${{ needs.test-sql-store.result }}" != "skipped" ]; then
            echo "::error::test-sql-store failed"
            exit 1
          fi
          if [ "${{ needs.test-dwn-server.result }}" != "success" ] && [ "${{ needs.test-dwn-server.result }}" != "skipped" ]; then
            echo "::error::test-dwn-server failed"
            exit 1
          fi

          # Browser tests: required when they run, OK to skip
          if [ "${{ needs.test-browser.result }}" != "success" ] && [ "${{ needs.test-browser.result }}" != "skipped" ]; then
            echo "::error::test-browser failed"
            exit 1
          fi

          # Coverage (node): required when it ran, OK to skip (no test jobs ran)
          if [ "${{ needs.coverage-node.result }}" != "success" ] && [ "${{ needs.coverage-node.result }}" != "skipped" ]; then
            echo "::error::coverage-node failed"
            exit 1
          fi

          # SonarCloud: required when configured and ran
          if [ -n "${{ vars.SONAR_PROJECT_KEY }}" ] && [ -n "${{ vars.SONAR_ORG }}" ]; then
            if [ "${{ needs.sonarcloud.result }}" != "success" ] && [ "${{ needs.sonarcloud.result }}" != "skipped" ]; then
              echo "::error::SonarCloud scan failed"
              exit 1
            fi
          fi

          echo "All checks passed"
