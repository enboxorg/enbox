      - name: Start NATS
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -m 8222
          for i in $(seq 1 30); do
            if wget -q --spider http://localhost:8222/healthz 2>/dev/null; then
              echo "NATS is ready"
              break
            fi
            sleep 1
          done

      - name: Run tests with coverage
        run: bun run --filter @enbox/dwn-server test:node:coverage
        env:
          NATS_URL: nats://localhost:4222

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/dwn-server/coverage
          cp packages/dwn-server/coverage/lcov.info coverage-staging/packages/dwn-server/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dwn-server
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Coverage: merge all LCOV files (node + browser) into one report and publish
  # it as the `coverage-merged` artifact for the SonarCloud jobs to consume.
  # This is the only coverage/Sonar job in `ci-passed`'s critical path, and it
  # is fast (~15s) — so CI Passed no longer serializes behind the ~150s Sonar
  # scan, which now runs in the sonar-pr / sonar-main jobs below.
  #
  # NOTE: intentionally does not depend on test-e2e — the e2e suite emits no
  # LCOV, so it must not be able to gate or delay coverage.
  # ---------------------------------------------------------------------------
  coverage:
    name: 'Coverage: merge'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: [changes, test-lightweight, test-dwn-sdk, test-agent, test-api-clients, test-sql-store, test-dwn-server, test-browser]
    if: >-
      always() && !cancelled() && needs.changes.outputs.src == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Merge coverage only when at least one test job actually produced LCOV.
      - name: Check for coverage-producing test jobs
        id: have_coverage
        run: |
          if [ "${{ needs.test-lightweight.result }}" = "success" ] || \
             [ "${{ needs.test-dwn-sdk.result }}" = "success" ] || \
             [ "${{ needs.test-agent.result }}" = "success" ] || \
             [ "${{ needs.test-api-clients.result }}" = "success" ] || \
             [ "${{ needs.test-sql-store.result }}" = "success" ] || \
             [ "${{ needs.test-dwn-server.result }}" = "success" ] || \
             [ "${{ needs.test-browser.result }}" = "success" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download coverage artifacts
        if: steps.have_coverage.outputs.value == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .
          merge-multiple: true

      - name: Merge LCOV coverage
        if: steps.have_coverage.outputs.value == 'true'
        run: bun run coverage:merge:reports

      - name: Upload merged coverage
        if: steps.have_coverage.outputs.value == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: coverage/merged/
          retention-days: 1
          if-no-files-found: error

      - name: Build coverage badges
        if: steps.have_coverage.outputs.value == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          shopt -s nullglob

          # Accumulate raw LF/LH per package so a package whose coverage is split
          # across several LCOV files (e.g. the two agent shards) still yields a
          # single, correctly-weighted badge.
          declare -A pkg_lf pkg_lh

          add_lcov() {
            local lcov_file="$1" pkg="$2" in_src=false

            while IFS= read -r line; do
              case "$line" in
                SF:src/*|SF:*/src/*) in_src=true ;;
                SF:*) in_src=false ;;
                LF:*)
                  if [ "$in_src" = true ]; then
                    pkg_lf[$pkg]=$(( ${pkg_lf[$pkg]:-0} + ${line#LF:} ))
                  fi
                  ;;
                LH:*)
                  if [ "$in_src" = true ]; then
                    pkg_lh[$pkg]=$(( ${pkg_lh[$pkg]:-0} + ${line#LH:} ))
                  fi
                  ;;
              esac
            done < "$lcov_file"
          }

          badge_color_for() {
            local cov="$1"

            if [ "$(echo "$cov >= 90" | bc -l)" = "1" ]; then
              echo "brightgreen"
            elif [ "$(echo "$cov >= 80" | bc -l)" = "1" ]; then
              echo "green"
            elif [ "$(echo "$cov >= 70" | bc -l)" = "1" ]; then
              echo "yellowgreen"
            elif [ "$(echo "$cov >= 60" | bc -l)" = "1" ]; then
              echo "yellow"
            else
              echo "red"
            fi
          }

          # Node coverage lives in coverage/; the sharded agent suite stages its
          # halves under coverage-shard-N/ instead.
          for lcov_file in packages/*/coverage/lcov.info packages/*/coverage-shard-*/lcov.info; do
            pkg=$(printf '%s' "$lcov_file" | sed -E 's#packages/([^/]+)/.*#\1#')
            add_lcov "$lcov_file" "$pkg"
          done

          mkdir -p coverage-badges
          found_any=false

          for pkg in "${!pkg_lf[@]}"; do
            found_any=true
            lf=${pkg_lf[$pkg]}
            lh=${pkg_lh[$pkg]:-0}
            if [ "$lf" -gt 0 ]; then
              coverage=$(awk "BEGIN { printf \"%.1f\", ($lh / $lf) * 100 }")
            else
              coverage="0.0"
            fi
            badge_color=$(badge_color_for "$coverage")

            printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
              "$coverage" "$badge_color" > "coverage-badges/${pkg}.json"
          done

          if [ "$found_any" = false ]; then
            echo "::warning::No coverage artifacts found for badge update"
          fi

      - name: Update coverage badges
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "::warning::GIST_TOKEN not set — skipping badge update"
            exit 0
          fi

          if ! compgen -G "coverage-badges/*.json" > /dev/null; then
            echo "No coverage badges generated; skipping badge update"
            exit 0
          fi

          GIST_ID="02d15f39a46173a612a8862ec6d7cfcf"

          payload='{"files":{'
          first=true
          for badge_file in coverage-badges/*.json; do
            [ -f "$badge_file" ] || continue
            filename=$(basename "$badge_file")
            content=$(cat "$badge_file")
            if [ "$first" = true ]; then
              first=false
            else
              payload+=','
            fi
            escaped=$(printf '%s' "$content" | jq -Rs .)
            payload+="\"$filename\":{\"content\":$escaped}"
            echo "  Badge: $filename -> $content"
          done
          payload+='}}'

          echo "Updating Gist with all badges..."
          response=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "$payload")

          http_code=$(echo "$response" | tail -1)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Coverage badges updated (HTTP $http_code)"
          else
            echo "::warning::Failed to update Gist (HTTP $http_code)"
            echo "$response" | head -5
          fi

  # ---------------------------------------------------------------------------
  # SonarCloud (PR quality gate): runs ONLY on pull requests and blocks the PR
  # on the quality gate (qualitygate.wait=true). It IS in `ci-passed`'s needs,
  # so a failed gate fails CI Passed and blocks the merge — the gate is
  # preserved, just no longer in the main-branch critical path. Consumes the
  # merged LCOV artifact from the `coverage` job.
  # ---------------------------------------------------------------------------
  sonar-pr:
    name: SonarCloud (PR gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, coverage]
    if: >-
      always() && !cancelled() &&
      needs.changes.outputs.src == 'true' &&
      github.event_name == 'pull_request' &&
      vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORG != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Sonar cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('sonar-project.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Download merged coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-merged
          path: coverage/merged

      - name: Validate SonarCloud secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Set the SONAR_TOKEN repository secret before enabling SonarCloud scanning"
            exit 1
          fi

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Block the PR on the quality gate for the new-code period.
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------------------
  # SonarCloud (main analysis): runs ONLY on pushes to main. It refreshes the
  # SonarCloud main-branch analysis + coverage record but does NOT block
  # (qualitygate.wait=false), and is intentionally NOT in `ci-passed`'s needs.
  # That is the whole point of this split: CI Passed (and the release flow that
  # keys off it) go green as soon as tests + coverage merge finish, instead of
  # waiting ~150s for a scan that does not gate main anyway.
  # ---------------------------------------------------------------------------
  sonar-main:
    name: SonarCloud (main analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, coverage]
    if: >-
      always() && !cancelled() &&
      needs.changes.outputs.src == 'true' &&
      github.event_name == 'push' &&
      vars.SONAR_PROJECT_KEY != '' && vars.SONAR_ORG != ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Sonar cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('sonar-project.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Download merged coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-merged
          path: coverage/merged

      - name: Validate SonarCloud secrets
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Set the SONAR_TOKEN repository secret before enabling SonarCloud scanning"
            exit 1
          fi

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Analysis only — main pushes don't block on pre-existing QG state.
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.pullrequest.github.repository=${{ github.repository }}
            -Dsonar.qualitygate.wait=false
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------------------
  # Browser tests: run Vitest browser mode with Playwright.
  #
  # Two-dimensional matrix: shard (package group) × browser.  Each cell runs
  # a single browser so browsers execute in parallel.
  #
  # Coverage is collected on the chromium cells only. All three engines run the
  # same spec files, so their line coverage is effectively identical — a second
  # and third instrumented run would only slow the (slower) Firefox/WebKit cells
  # without moving the merged SonarCloud number. Firefox/WebKit therefore run
  # uninstrumented as pure correctness checks.
  #
  # Trade-off: 9 jobs instead of 3, but each job only installs one Playwright
  # browser (~20s) and runs ~1/3 the tests, so wall-clock time drops from
  # ~3 min (old 3-shard, 3-browser sequential) to ~1 min.
  # ---------------------------------------------------------------------------
  test-browser:
    name: 'Test: Browser (${{ matrix.shard.name }} / ${{ matrix.browser }})'
    runs-on: ubuntu-latest
    timeout-minutes: 21
    needs: [build, changes]
    if: needs.changes.outputs.needs_browser_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Shard 1 — crypto: 25 browser test files
          - name: crypto
            packages: '@enbox/common @enbox/crypto'
            coverage-dirs: common crypto
          # Shard 2 — dwn-sdk-js: 25 browser test files
          - name: dwn-sdk-js
            packages: '@enbox/dwn-sdk-js'
            coverage-dirs: dwn-sdk-js
          # Shard 3 — remaining: dids(11) + browser(1) + agent(3) + api(1) = 16 files
          - name: dids-agent-api
            packages: '@enbox/dids @enbox/browser @enbox/agent @enbox/api'
            coverage-dirs: dids browser agent api
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Cache Playwright browser & system deps
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/playwright-apt-cache
          # v4 suffix busts stale caches after Ubuntu runner package revs
          # created exact-version Mesa dependency skew for WebKit.
          key: ${{ runner.os }}-playwright-v4-${{ matrix.browser }}-${{ hashFiles('package.json') }}

      - name: Install Playwright system deps (from cache)
        # On cache hit the .deb files are already saved in ~/playwright-apt-cache.
        # Install them directly with dpkg — no network needed, takes ~5s.
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          if [ -d ~/playwright-apt-cache ] && ls ~/playwright-apt-cache/*.deb 1>/dev/null 2>&1; then
            echo "Installing $(ls ~/playwright-apt-cache/*.deb | wc -l) cached .deb packages"
            sudo dpkg -i ~/playwright-apt-cache/*.deb || true
            sudo apt-get update -qq
            sudo apt-get install -f -y
          fi

      - name: Install Playwright system deps (fresh)
        # Most Playwright deps are already on the runner image. Firefox/WebKit
        # need a handful of extra font packages (fonts-ipafont-gothic,
        # fonts-wqy-zenhei, etc.) that are 3-7 MB each and download at
        # ~50 KB/s from Azure apt mirrors — often stalling for minutes.
        #
        # We snapshot /var/cache/apt/archives before and after so we only
        # cache the .deb files that Playwright actually installed — not the
        # hundreds of pre-existing system packages.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          ls /var/cache/apt/archives/*.deb 2>/dev/null | sort > /tmp/apt-before.txt || true
          sudo apt-get update -qq
          bunx playwright install-deps ${{ matrix.browser }}
          mkdir -p ~/playwright-apt-cache
          comm -13 /tmp/apt-before.txt <(ls /var/cache/apt/archives/*.deb 2>/dev/null | sort) \
            | xargs -I{} cp {} ~/playwright-apt-cache/ 2>/dev/null || true
          echo "Cached $(ls ~/playwright-apt-cache/*.deb 2>/dev/null | wc -l) Playwright .deb packages"
        timeout-minutes: 15

      - name: Install Playwright browser
        # playwright@1.45.3 is pinned in root devDependencies to match the
        # version resolved for @vitest/browser-playwright's peer dependency.
        # On cache hit the binary is already present — this is a no-op.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: bunx playwright install ${{ matrix.browser }}

      - name: Run browser tests
        id: browser-tests
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
        # Coverage is collected even when some tests fail. Use continue-on-error
        # so the staging/upload steps always run, then re-check the exit code in
        # the final step to fail the job if tests actually broke.
        continue-on-error: true
        run: |
          # Collect coverage on chromium only — Firefox/WebKit run the same
          # specs, so instrumenting them too would only slow the slower engines
          # without changing the merged LCOV.
          script="test:browser"
          if [ "${{ matrix.browser }}" = "chromium" ]; then
            script="test:browser:coverage"
          fi

          # Firefox's ESM loader can transiently crash with "error loading
          # dynamically imported module" (affects ~14% of runs, random test
          # file each time).  Vitest's test-level retry cannot recover from
          # file-level import failures, so we retry the entire vitest
          # invocation once per package when running Firefox.
          max_attempts=1
          if [ "${{ matrix.browser }}" = "firefox" ]; then
            max_attempts=2
          fi

          exit_code=0
          for pkg in ${{ matrix.shard.packages }}; do
            attempt=1
            pkg_passed=false
            while [ $attempt -le $max_attempts ]; do
              if bun run --filter "$pkg" "$script" -- --browser.connectTimeout=120000; then
                pkg_passed=true
                break
              fi
              if [ $attempt -lt $max_attempts ]; then
                echo "::warning::Browser tests for $pkg failed on attempt $attempt — retrying…"
              fi
              attempt=$((attempt + 1))
            done
            if [ "$pkg_passed" = false ]; then
              exit_code=1
            fi
          done
          exit $exit_code

      # Only the chromium cells produce a coverage-browser-chromium directory.
      - name: Stage browser coverage
        if: always() && matrix.browser == 'chromium'
        run: |
          for dir in ${{ matrix.shard.coverage-dirs }}; do
            mkdir -p "coverage-staging/packages/${dir}/coverage-browser-${{ matrix.browser }}"
            cp "packages/${dir}/coverage-browser-${{ matrix.browser }}/lcov.info" \
               "coverage-staging/packages/${dir}/coverage-browser-${{ matrix.browser }}/lcov.info" 2>/dev/null || true
          done

      - name: Upload browser coverage
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-browser-${{ matrix.shard.name }}-${{ matrix.browser }}
          path: coverage-staging/
          if-no-files-found: warn

      - name: Fail if browser tests failed
        if: always() && steps.browser-tests.outcome == 'failure'
        run: |
          echo "::error::Browser tests failed in shard '${{ matrix.shard.name }}' / ${{ matrix.browser }} (coverage was still collected)"
          exit 1

  # ---------------------------------------------------------------------------
  # Gate job for branch protection — always runs so required checks pass even
  # when the pipeline is skipped (e.g. docs-only changes).
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [changes, lint, build, test-lightweight, test-dwn-sdk, test-agent, test-api-clients, test-e2e, test-sql-store, test-dwn-server, test-browser, sonar-pr]
    if: always()
    steps:
      - name: Check results
        run: |
          # Docs-only change — nothing to test
          if [ "${{ needs.changes.outputs.src }}" != "true" ]; then
            echo "Skipped: docs-only change"
            exit 0
          fi

          # Lint and build must always succeed when src changed
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::lint failed"
            exit 1
          fi
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build failed"
            exit 1
          fi

          # Test jobs: required when they run, OK to skip (no relevant changes)
          if [ "${{ needs.test-lightweight.result }}" != "success" ] && [ "${{ needs.test-lightweight.result }}" != "skipped" ]; then
            echo "::error::test-lightweight failed"
            exit 1
          fi
          if [ "${{ needs.test-dwn-sdk.result }}" != "success" ] && [ "${{ needs.test-dwn-sdk.result }}" != "skipped" ]; then
            echo "::error::test-dwn-sdk failed"
            exit 1
          fi
          if [ "${{ needs.test-agent.result }}" != "success" ] && [ "${{ needs.test-agent.result }}" != "skipped" ]; then
            echo "::error::test-agent failed"
            exit 1
          fi
          if [ "${{ needs.test-api-clients.result }}" != "success" ] && [ "${{ needs.test-api-clients.result }}" != "skipped" ]; then
            echo "::error::test-api-clients failed"
            exit 1
          fi
          if [ "${{ needs.test-e2e.result }}" != "success" ] && [ "${{ needs.test-e2e.result }}" != "skipped" ]; then
            echo "::error::test-e2e failed"
            exit 1
          fi
          if [ "${{ needs.test-sql-store.result }}" != "success" ] && [ "${{ needs.test-sql-store.result }}" != "skipped" ]; then
            echo "::error::test-sql-store failed"
            exit 1
          fi
          if [ "${{ needs.test-dwn-server.result }}" != "success" ] && [ "${{ needs.test-dwn-server.result }}" != "skipped" ]; then
            echo "::error::test-dwn-server failed"
            exit 1
          fi

          # Browser tests: required when they run, OK to skip
          if [ "${{ needs.test-browser.result }}" != "success" ] && [ "${{ needs.test-browser.result }}" != "skipped" ]; then
            echo "::error::test-browser failed"
            exit 1
          fi

          # Coverage merge is intentionally NOT a direct dependency of this gate:
          # on main it only feeds the non-gating sonar-main scan, so CI Passed can
          # green as soon as tests finish instead of waiting on the merge. On PRs
          # it is still enforced transitively — sonar-pr needs coverage, and a
          # broken merge leaves the scan without coverage, failing the quality
          # gate below.
          #
          # SonarCloud PR quality gate: gates pull requests. A failed quality
          # gate fails sonar-pr, which fails this job and blocks the merge. It is
          # skipped on main pushes and on fork PRs without Sonar vars — both OK.
          # (The non-gating sonar-main analysis job is intentionally excluded
          # from this gate so main pushes don't wait on the scan.)
          if [ "${{ needs.sonar-pr.result }}" != "success" ] && [ "${{ needs.sonar-pr.result }}" != "skipped" ]; then
            echo "::error::sonar-pr (quality gate) failed"
            exit 1
          fi

          echo "All checks passed"
