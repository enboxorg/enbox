name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres-dwn-server:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Start Pkarr relay
        run: |
          docker run -d --name pkarr-relay -p 7527:15411 synonymsoft/pkarr pkarr-relay --testnet
          echo "Waiting for Pkarr relay..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7527/ >/dev/null 2>&1 || [ $? -eq 22 ]; then
              echo "Pkarr relay is ready"
              break
            fi
            sleep 2
          done

      - name: Start dwn-server
        run: |
          cd packages/dwn-server

          export DS_PORT=3000
          export DWN_BASE_URL=http://localhost:3000
          export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_EVENTS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527

          bun dist/esm/src/main.js &
          echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for dwn-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/info >/dev/null 2>&1; then
              echo "dwn-server is ready"
              break
            fi
            sleep 2
          done

          cd ../..

      - name: Run tests
        run: |
          export DB_HOST=localhost
          export DB_PORT=5432
          export DB_USER=root
          export DB_PASSWORD=dwn
          export DB_NAME=dwn
          export MYSQL_HOST=localhost
          export MYSQL_PORT=3306
          export MYSQL_USER=root
          export MYSQL_PASSWORD=dwn
          export MYSQL_DATABASE=dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527

          bun run test:node

      - name: Stop dwn-server
        if: always()
        run: |
          if [ -n "$DWN_SERVER_PID" ]; then
            kill "$DWN_SERVER_PID" || true
          fi
          docker rm -f pkarr-relay || true

  # Gate job for branch protection -- require this to pass before merging
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Tests failed"
            exit 1
          fi
          echo "All checks passed"
