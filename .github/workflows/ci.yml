        run: |
          mkdir -p coverage-staging/packages/dwn-sql-store/coverage
          cp packages/dwn-sql-store/coverage/lcov.info coverage-staging/packages/dwn-sql-store/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sql-store
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # DWN Server: self-contained tests (SQLite in-memory, no external services)
  # ---------------------------------------------------------------------------
  test-dwn-server:
    name: 'Test: dwn-server'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, changes]
    if: needs.changes.outputs.needs_dwn_server == 'true'

    steps:
      - name: Checkout repository
