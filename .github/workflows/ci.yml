name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Detect whether source code changed. Docs-only PRs skip the entire pipeline
  # but the ci-passed gate job still reports success (required for branch protection).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          # With the default predicate-quantifier ('some'), a file only needs
          # to match ONE pattern to be considered changed.  Since '**' matches
          # everything, the negation patterns were silently ignored and the
          # filter always returned true.
          #
          # With 'every', a file must match ALL patterns.  A .md file matches
          # '**' but fails '!**/*.md', so it's excluded — which is the
          # intended behavior.
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!**/LICENSE'
              - '!**/CODE_OF_CONDUCT*'
              - '!docs/**'
              - '!.changeset/**'
              - '!scripts/**'

  # ---------------------------------------------------------------------------
  # Shared setup: install, lint, build, then upload the workspace as an artifact
  # so downstream test jobs don't each have to rebuild.
  # ---------------------------------------------------------------------------
  setup:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.src == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: workspace-build
          path: packages/*/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Lightweight packages: common, crypto (no external services needed)
  # ---------------------------------------------------------------------------
  test-lightweight:
    name: 'Test: common / crypto'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Run tests with coverage
        run: |
          bun run --filter @enbox/common  test:node:coverage
          bun run --filter @enbox/crypto  test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/common coverage-staging/crypto
          cp packages/common/coverage/lcov.info coverage-staging/common/lcov.info 2>/dev/null || true
          cp packages/crypto/coverage/lcov.info coverage-staging/crypto/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lightweight
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # DWN SDK: large test suite, but no external services (LevelDB in-process)
  # ---------------------------------------------------------------------------
  test-dwn-sdk:
    name: 'Test: dwn-sdk-js'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Run tests with coverage
        run: bun run --filter @enbox/dwn-sdk-js test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/dwn-sdk-js
          cp packages/dwn-sdk-js/coverage/lcov.info coverage-staging/dwn-sdk-js/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dwn-sdk
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # dids + Agent + API: need a live Pkarr relay and dwn-server (backed by Postgres)
  # ---------------------------------------------------------------------------
  test-agent-api:
    name: 'Test: dids / agent / api'
    runs-on: ubuntu-latest
    needs: setup

    services:
      postgres-dwn-server:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Start Pkarr relay
        run: |
          docker run -d --name pkarr-relay -p 7527:15411 synonymsoft/pkarr pkarr-relay --testnet
          echo "Waiting for Pkarr relay..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7527/ >/dev/null 2>&1 || [ $? -eq 22 ]; then
              echo "Pkarr relay is ready"
              break
            fi
            sleep 2
          done

      - name: Start dwn-server
        run: |
          export DS_PORT=3000
          export DWN_BASE_URL=http://localhost:3000
          export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_STATE_INDEX=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          export DWN_RATE_LIMIT_REQUESTS_PER_SECOND=0
          export DWN_RATE_LIMIT_TENANT_REQUESTS_PER_SECOND=0

          bun packages/dwn-server/dist/esm/src/main.js &
          echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for dwn-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/info >/dev/null 2>&1; then
              echo "dwn-server is ready"
              break
            fi
            sleep 2
          done

      - name: Run tests with coverage
        run: |
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          bun run --filter @enbox/dids         test:node:coverage
          bun run --filter @enbox/dwn-clients  test:node:coverage
          bun run --filter @enbox/agent        test:node:coverage
          bun run --filter @enbox/api          test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/dids coverage-staging/dwn-clients coverage-staging/agent coverage-staging/api
          cp packages/dids/coverage/lcov.info coverage-staging/dids/lcov.info 2>/dev/null || true
          cp packages/dwn-clients/coverage/lcov.info coverage-staging/dwn-clients/lcov.info 2>/dev/null || true
          cp packages/agent/coverage/lcov.info coverage-staging/agent/lcov.info 2>/dev/null || true
          cp packages/api/coverage/lcov.info coverage-staging/api/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-api
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: |
          if [ -n "$DWN_SERVER_PID" ]; then
            kill "$DWN_SERVER_PID" || true
          fi
          docker rm -f pkarr-relay || true

  # ---------------------------------------------------------------------------
  # SQL Store: needs Postgres + MySQL for dialect-specific tests
  # ---------------------------------------------------------------------------
  test-sql-store:
    name: 'Test: dwn-sql-store'
    runs-on: ubuntu-latest
    needs: setup

    services:
      postgres:
        image: postgres:13.3
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: root
          POSTGRES_PASSWORD: dwn
          POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: dwn
          MYSQL_DATABASE: dwn
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          # Wait for MinIO to be ready.
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done

      - name: Run tests with coverage
        env:
          S3_ENDPOINT: http://localhost:9000
        run: bun run --filter @enbox/dwn-sql-store test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/dwn-sql-store
          cp packages/dwn-sql-store/coverage/lcov.info coverage-staging/dwn-sql-store/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-sql-store
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # DWN Server: self-contained tests (SQLite in-memory, no external services)
  # ---------------------------------------------------------------------------
  test-dwn-server:
    name: 'Test: dwn-server'
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -m 8222
          for i in $(seq 1 30); do
            if wget -q --spider http://localhost:8222/healthz 2>/dev/null; then
              echo "NATS is ready"
              break
            fi
            sleep 1
          done

      - name: Run tests with coverage
        run: bun run --filter @enbox/dwn-server test:node:coverage
        env:
          NATS_URL: nats://localhost:4222

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/dwn-server
          cp packages/dwn-server/coverage/lcov.info coverage-staging/dwn-server/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dwn-server
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Coverage: parse lcov reports, enforce 90% threshold, comment on PR
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: [changes, test-lightweight, test-dwn-sdk, test-agent-api, test-sql-store, test-dwn-server, test-browser]
    if: always() && !cancelled() && needs.changes.outputs.src == 'true'

    steps:
      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts
          merge-multiple: true

      - name: Check coverage thresholds
        id: coverage-check
        shell: bash
        run: |
          # ── helper: parse an lcov file and print the line-coverage % ──
          parse_lcov() {
            local lcov_file="$1"
            local total_lf=0 total_lh=0 in_src=false
            while IFS= read -r line; do
              case "$line" in
                SF:src/*) in_src=true ;;
                SF:*)     in_src=false ;;
                LF:*)     $in_src && total_lf=$((total_lf + ${line#LF:})) ;;
                LH:*)     $in_src && total_lh=$((total_lh + ${line#LH:})) ;;
              esac
            done < "$lcov_file"
            if [ "$total_lf" -gt 0 ]; then
              awk "BEGIN { printf \"%.1f\", ($total_lh / $total_lf) * 100 }"
            else
              echo "0.0"
            fi
          }

          badge_color_for() {
            local cov="$1"
            if   [ "$(echo "$cov >= 90" | bc -l)" = "1" ]; then echo "brightgreen"
            elif [ "$(echo "$cov >= 80" | bc -l)" = "1" ]; then echo "green"
            elif [ "$(echo "$cov >= 70" | bc -l)" = "1" ]; then echo "yellowgreen"
            elif [ "$(echo "$cov >= 60" | bc -l)" = "1" ]; then echo "yellow"
            else echo "red"
            fi
          }

          browsers="chromium firefox webkit"
          failed=false
          found_any=false
          threshold=98
          mkdir -p coverage-badges

          # Temp files: node rows and a TSV of (pkg, browser, coverage) for
          # browser results that we pivot into a single table at the end.
          node_file=$(mktemp)
          browser_tsv=$(mktemp)

          for lcov_file in coverage-artifacts/*/lcov.info; do
            [ -f "$lcov_file" ] || continue
            found_any=true

            dir_name=$(echo "$lcov_file" | sed 's|coverage-artifacts/\([^/]*\)/.*|\1|')
            coverage=$(parse_lcov "$lcov_file")
            badge_color=$(badge_color_for "$coverage")

            printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
              "$coverage" "$badge_color" > "coverage-badges/${dir_name}.json"

            # Classify: is this a per-browser directory (e.g. common-chromium)?
            matched_browser=""
            for b in $browsers; do
              case "$dir_name" in *-"$b") matched_browser="$b" ;; esac
            done

            if [ -n "$matched_browser" ]; then
              pkg=$(echo "$dir_name" | sed "s/-${matched_browser}\$//")
              printf '%s\t%s\t%s\n' "$pkg" "$matched_browser" "$coverage" >> "$browser_tsv"
            else
              pkg="$dir_name"
              if [ "$(echo "$coverage < $threshold" | bc -l)" = "1" ]; then
                echo "| $pkg | ${coverage}% | :x: Below ${threshold}% |" >> "$node_file"
                echo "::error::Coverage for $pkg is ${coverage}%, below ${threshold}% threshold"
                failed=true
              else
                echo "| $pkg | ${coverage}% | :white_check_mark: |" >> "$node_file"
              fi
            fi
          done

          # ── Assemble the markdown report ──
          {
            echo "## Coverage Report"
            echo ""
            echo "### Node (bun test)"
            echo ""
            echo "| Package | Line Coverage | Status |"
            echo "|---------|---------------|--------|"
            if [ -s "$node_file" ]; then
              cat "$node_file"
            else
              echo "| _(no data)_ | — | — |"
            fi
            echo ""

            if [ "$found_any" = false ]; then
              echo ":x: **No coverage artifacts found.** Ensure test jobs upload lcov reports."
            elif [ "$failed" = true ]; then
              echo ":x: **Coverage check failed**: one or more packages are below the ${threshold}% threshold."
            else
              echo ":white_check_mark: **All packages meet the ${threshold}% coverage threshold.**"
            fi
            echo ""

            # Browser table: one row per package, one column per browser.
            if [ -s "$browser_tsv" ]; then
              echo "<details>"
              echo "<summary>Browser Coverage (informational)</summary>"
              echo ""
              cr_icon='![Chromium](https://img.shields.io/badge/-Chromium-4285F4?logo=googlechrome&logoColor=white&style=flat-square)'
              ff_icon='![Firefox](https://img.shields.io/badge/-Firefox-FF7139?logo=firefox&logoColor=white&style=flat-square)'
              wk_icon='![WebKit](https://img.shields.io/badge/-WebKit-006CFF?logo=safari&logoColor=white&style=flat-square)'
              echo "| Package | $cr_icon | $ff_icon | $wk_icon |"
              echo "|---------|----------|---------|--------|"

              # Collect unique package names (sorted) from the TSV
              sort -t$'\t' -k1,1 "$browser_tsv" -o "$browser_tsv"
              pkg_list=$(cut -f1 "$browser_tsv" | sort -u)

              for pkg in $pkg_list; do
                chromium_cov=$(awk -F'\t' -v p="$pkg" '$1==p && $2=="chromium" {print $3}' "$browser_tsv")
                firefox_cov=$(awk -F'\t' -v p="$pkg" '$1==p && $2=="firefox" {print $3}' "$browser_tsv")
                webkit_cov=$(awk -F'\t' -v p="$pkg" '$1==p && $2=="webkit" {print $3}' "$browser_tsv")
                cr_cell="${chromium_cov:+${chromium_cov}%}" ; cr_cell="${cr_cell:-—}"
                ff_cell="${firefox_cov:+${firefox_cov}%}" ; ff_cell="${ff_cell:-—}"
                wk_cell="${webkit_cov:+${webkit_cov}%}"   ; wk_cell="${wk_cell:-—}"
                echo "| $pkg | $cr_cell | $ff_cell | $wk_cell |"
              done

              echo ""
              echo "_Browser coverage is informational only (subset of tests)._"
              echo "_Node coverage enforces the ${threshold}% threshold._"
              echo ""
              echo "</details>"
            fi
          } > coverage-report.md

          # Clean up temp files
          rm -f "$node_file" "$browser_tsv"

          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$found_any" = false ]; then
            echo "::error::No coverage artifacts found"
            exit 1
          fi
          if [ "$failed" = true ]; then
            exit 1
          fi

      - name: Comment PR with coverage
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage-report.md', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Coverage Report')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Update coverage badge data in a public Gist (main branch only).
      # TODO: When the repo is made public, migrate to Codecov or GitHub Pages.
      - name: Update coverage badges
        if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_TOKEN" ]; then
            echo "::warning::GIST_TOKEN not set — skipping badge update"
            exit 0
          fi

          GIST_ID="02d15f39a46173a612a8862ec6d7cfcf"

          # Build a single JSON payload with all badge files
          payload='{"files":{'
          first=true
          for badge_file in coverage-badges/*.json; do
            [ -f "$badge_file" ] || continue
            filename=$(basename "$badge_file")
            content=$(cat "$badge_file")
            if [ "$first" = true ]; then
              first=false
            else
              payload+=','
            fi
            # Escape the content for JSON string value
            escaped=$(printf '%s' "$content" | jq -Rs .)
            payload+="\"$filename\":{\"content\":$escaped}"
            echo "  Badge: $filename -> $content"
          done
          payload+='}}'

          echo "Updating Gist with all badges..."
          response=$(curl -s -w "\n%{http_code}" -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "$payload")

          http_code=$(echo "$response" | tail -1)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Coverage badges updated (HTTP $http_code)"
          else
            echo "::warning::Failed to update Gist (HTTP $http_code)"
            echo "$response" | head -5
          fi

  # ---------------------------------------------------------------------------
  # Browser tests: run Vitest browser mode with Playwright.
  #
  # Two-dimensional matrix: shard (package group) × browser.  Each cell runs
  # a single browser so (a) browsers execute in parallel and (b) coverage is
  # collected per-browser, enabling the coverage job to report separate tables
  # for Chromium, Firefox and WebKit.
  #
  # Trade-off: 9 jobs instead of 3, but each job only installs one Playwright
  # browser (~20s) and runs ~1/3 the tests, so wall-clock time drops from
  # ~3 min (old 3-shard, 3-browser sequential) to ~1 min.
  # ---------------------------------------------------------------------------
  test-browser:
    name: 'Test: Browser (${{ matrix.shard.name }} / ${{ matrix.browser }})'
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Shard 1 — crypto: 25 browser test files
          - name: crypto
            packages: '@enbox/common @enbox/crypto'
            coverage-dirs: common crypto
          # Shard 2 — dwn-sdk-js: 25 browser test files
          - name: dwn-sdk-js
            packages: '@enbox/dwn-sdk-js'
            coverage-dirs: dwn-sdk-js
          # Shard 3 — remaining: dids(11) + browser(1) + agent(3) + api(1) = 16 files
          - name: dids-agent-api
            packages: '@enbox/dids @enbox/browser @enbox/agent @enbox/api'
            coverage-dirs: dids browser agent api
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Install Playwright browser
        # Only install the single browser needed for this matrix cell.
        # playwright@1.45.3 is pinned in root devDependencies to match the
        # version resolved for @vitest/browser-playwright's peer dependency.
        run: bunx playwright install --with-deps ${{ matrix.browser }}

      - name: Run browser tests with coverage
        id: browser-tests
        env:
          CI: true
          BROWSER: ${{ matrix.browser }}
        # Coverage is collected even when some tests fail. Use continue-on-error
        # so the staging/upload steps always run, then re-check the exit code in
        # the final step to fail the job if tests actually broke.
        continue-on-error: true
        run: |
          exit_code=0
          for pkg in ${{ matrix.shard.packages }}; do
            bun run --filter "$pkg" test:browser:coverage || exit_code=$?
          done
          exit $exit_code

      - name: Stage browser coverage
        if: always()
        run: |
          for dir in ${{ matrix.shard.coverage-dirs }}; do
            mkdir -p "coverage-staging/${dir}-${{ matrix.browser }}"
            cp "packages/${dir}/coverage-browser-${{ matrix.browser }}/lcov.info" \
               "coverage-staging/${dir}-${{ matrix.browser }}/lcov.info" 2>/dev/null || true
          done

      - name: Upload browser coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-browser-${{ matrix.shard.name }}-${{ matrix.browser }}
          path: coverage-staging/

      - name: Fail if browser tests failed
        if: always() && steps.browser-tests.outcome == 'failure'
        run: |
          echo "::error::Browser tests failed in shard '${{ matrix.shard.name }}' / ${{ matrix.browser }} (coverage was still collected)"
          exit 1

  # ---------------------------------------------------------------------------
  # Gate job for branch protection — always runs so required checks pass even
  # when the pipeline is skipped (e.g. docs-only changes).
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [changes, test-lightweight, test-dwn-sdk, test-agent-api, test-sql-store, test-dwn-server, test-browser, coverage]
    if: always()
    steps:
      - name: Check results
        run: |
          # Docs-only change — nothing to test
          if [ "${{ needs.changes.outputs.src }}" != "true" ]; then
            echo "Skipped: docs-only change"
            exit 0
          fi

          # All test jobs must succeed
          if [ "${{ needs.test-lightweight.result }}" != "success" ]; then
            echo "::error::test-lightweight failed"
            exit 1
          fi
          if [ "${{ needs.test-dwn-sdk.result }}" != "success" ]; then
            echo "::error::test-dwn-sdk failed"
            exit 1
          fi
          if [ "${{ needs.test-agent-api.result }}" != "success" ]; then
            echo "::error::test-agent-api failed"
            exit 1
          fi
          if [ "${{ needs.test-sql-store.result }}" != "success" ]; then
            echo "::error::test-sql-store failed"
            exit 1
          fi
          if [ "${{ needs.test-dwn-server.result }}" != "success" ]; then
            echo "::error::test-dwn-server failed"
            exit 1
          fi
          if [ "${{ needs.test-browser.result }}" != "success" ]; then
            echo "::error::test-browser failed"
            exit 1
          fi

          # Coverage must pass on PRs
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::error::Coverage check failed"
            exit 1
          fi

          echo "All checks passed"
