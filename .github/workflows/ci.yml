name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Detect whether source code changed. Docs-only PRs skip the entire pipeline
  # but the ci-passed gate job still reports success (required for branch protection).
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      src: ${{ steps.src-filter.outputs.src }}
      needs_common_crypto: ${{ steps.propagate.outputs.needs_common_crypto }}
      needs_lightweight: ${{ steps.propagate.outputs.needs_lightweight }}
      needs_dids: ${{ steps.propagate.outputs.needs_dids }}
      needs_dwn_sdk: ${{ steps.propagate.outputs.needs_dwn_sdk }}
      needs_dwn_clients: ${{ steps.propagate.outputs.needs_dwn_clients }}
      needs_dwn_sql_store: ${{ steps.propagate.outputs.needs_dwn_sql_store }}
      needs_dwn_server: ${{ steps.propagate.outputs.needs_dwn_server }}
      needs_agent: ${{ steps.propagate.outputs.needs_agent }}
      needs_local_node: ${{ steps.propagate.outputs.needs_local_node }}
      needs_auth: ${{ steps.propagate.outputs.needs_auth }}
      needs_api: ${{ steps.propagate.outputs.needs_api }}
      needs_agent_api_group: ${{ steps.propagate.outputs.needs_agent_api_group }}
      needs_browser_tests: ${{ steps.propagate.outputs.needs_browser_tests }}
      needs_e2e: ${{ steps.propagate.outputs.needs_e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Two filter steps: 'src' needs predicate-quantifier 'every' so that
      # negation patterns (e.g. !**/*.md) work correctly.  Per-package filters
      # need the default 'some' (match ANY pattern) since each filter lists
      # multiple inclusion globs for the same package.
      - name: Check for source changes
        uses: dorny/paths-filter@v3
        id: src-filter
        with:
          base: main
          predicate-quantifier: 'every'
          filters: |
            src:
              - '**'
              - '!**/*.md'
              - '!**/LICENSE'
              - '!**/CODE_OF_CONDUCT*'
              - '!docs/**'
              - '!.changeset/**'

      - name: Detect per-package changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: main
          filters: |
            workspace:
              - 'package.json'
              - 'bun.lock'
              - 'tsconfig.json'
              - 'turbo.json'
              - 'eslint.config.cjs'
              - 'sonar-project.properties'
              - '.github/workflows/ci.yml'
              - 'scripts/**'
              - 'build/**'

            common-crypto:
              - 'packages/common/src/**'
              - 'packages/common/tests/**'
              - 'packages/common/package.json'
              - 'packages/common/tsconfig.json'
              - 'packages/common/vitest*.config.*'
              - 'packages/crypto/src/**'
              - 'packages/crypto/tests/**'
              - 'packages/crypto/package.json'
              - 'packages/crypto/tsconfig.json'
              - 'packages/crypto/vitest*.config.*'

            dids:
              - 'packages/dids/src/**'
              - 'packages/dids/tests/**'
              - 'packages/dids/package.json'
              - 'packages/dids/tsconfig.json'
              - 'packages/dids/vitest*.config.*'

            dwn-sdk:
              - 'packages/dwn-sdk-js/src/**'
              - 'packages/dwn-sdk-js/tests/**'
              - 'packages/dwn-sdk-js/json-schemas/**'
              - 'packages/dwn-sdk-js/build/**'
              - 'packages/dwn-sdk-js/package.json'
              - 'packages/dwn-sdk-js/tsconfig.json'
              - 'packages/dwn-sdk-js/vitest*.config.*'

            connect:
              - 'packages/connect/src/**'
              - 'packages/connect/tests/**'
              - 'packages/connect/package.json'
              - 'packages/connect/tsconfig.json'
              - 'packages/connect/vitest*.config.*'

            dwn-clients:
              - 'packages/dwn-clients/src/**'
              - 'packages/dwn-clients/tests/**'
              - 'packages/dwn-clients/package.json'
              - 'packages/dwn-clients/tsconfig.json'
              - 'packages/dwn-clients/vitest*.config.*'

            dwn-sql-store:
              - 'packages/dwn-sql-store/src/**'
              - 'packages/dwn-sql-store/tests/**'
              - 'packages/dwn-sql-store/package.json'
              - 'packages/dwn-sql-store/tsconfig.json'
              - 'packages/dwn-sql-store/vitest*.config.*'

            dwn-server:
              - 'packages/dwn-server/src/**'
              - 'packages/dwn-server/tests/**'
              - 'packages/dwn-server/package.json'
              - 'packages/dwn-server/tsconfig.json'
              - 'packages/dwn-server/vitest*.config.*'

            local-node:
              - 'packages/local-node/src/**'
              - 'packages/local-node/tests/**'
              - 'packages/local-node/package.json'
              - 'packages/local-node/tsconfig.json'

            agent:
              - 'packages/agent/src/**'
              - 'packages/agent/tests/**'
              - 'packages/agent/package.json'
              - 'packages/agent/tsconfig.json'
              - 'packages/agent/vitest*.config.*'

            auth:
              - 'packages/auth/src/**'
              - 'packages/auth/tests/**'
              - 'packages/auth/package.json'
              - 'packages/auth/tsconfig.json'
              - 'packages/auth/vitest*.config.*'

            api:
              - 'packages/api/src/**'
              - 'packages/api/tests/**'
              - 'packages/api/package.json'
              - 'packages/api/tsconfig.json'
              - 'packages/api/vitest*.config.*'

            protocols:
              - 'packages/protocols/src/**'
              - 'packages/protocols/tests/**'
              - 'packages/protocols/package.json'
              - 'packages/protocols/tsconfig.json'

            protocol-codegen:
              - 'packages/protocol-codegen/src/**'
              - 'packages/protocol-codegen/tests/**'
              - 'packages/protocol-codegen/package.json'
              - 'packages/protocol-codegen/tsconfig.json'

            browser-pkg:
              - 'packages/browser/src/**'
              - 'packages/browser/tests/**'
              - 'packages/browser/package.json'
              - 'packages/browser/tsconfig.json'
              - 'packages/browser/vitest*.config.*'

            cli:
              - 'packages/cli/src/**'
              - 'packages/cli/tests/**'
              - 'packages/cli/package.json'
              - 'packages/cli/tsconfig.json'

      - name: Propagate changes through dependency graph
        id: propagate
        run: |
          # Convert filter outputs to shell booleans
          workspace="${{ steps.filter.outputs.workspace }}"
          common_crypto="${{ steps.filter.outputs.common-crypto }}"
          dids="${{ steps.filter.outputs.dids }}"
          dwn_sdk="${{ steps.filter.outputs.dwn-sdk }}"
          connect="${{ steps.filter.outputs.connect }}"
          dwn_clients="${{ steps.filter.outputs.dwn-clients }}"
          dwn_sql_store="${{ steps.filter.outputs.dwn-sql-store }}"
          dwn_server="${{ steps.filter.outputs.dwn-server }}"
          local_node="${{ steps.filter.outputs.local-node }}"
          agent="${{ steps.filter.outputs.agent }}"
          auth="${{ steps.filter.outputs.auth }}"
          api="${{ steps.filter.outputs.api }}"
          protocols="${{ steps.filter.outputs.protocols }}"
          protocol_codegen="${{ steps.filter.outputs.protocol-codegen }}"
          browser_pkg="${{ steps.filter.outputs.browser-pkg }}"
          cli="${{ steps.filter.outputs.cli }}"

          # On pushes to `main`, force the full test + coverage suite so the
          # SonarCloud main-branch analysis always receives a complete LCOV
          # report. Without this, a merge touching only a package that emits no
          # coverage (e.g. dwn-server-admin-ui) skips every test job, produces
          # no merged coverage artifact, and SonarCloud then records the ENTIRE
          # project at 0% coverage. Setting the graph-root `workspace` flag
          # cascades `true` to every package below. PRs keep the fast,
          # selective behavior.
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ steps.src-filter.outputs.src }}" = "true" ]; then
            workspace=true
          fi

          # Propagate down the dependency graph
          needs_common_crypto=$( [ "$workspace" = "true" ] || [ "$common_crypto" = "true" ] && echo true || echo false )
          needs_dids=$( [ "$needs_common_crypto" = "true" ] || [ "$dids" = "true" ] && echo true || echo false )
          needs_dwn_sdk=$( [ "$needs_dids" = "true" ] || [ "$dwn_sdk" = "true" ] && echo true || echo false )
          needs_connect=$( [ "$needs_dwn_sdk" = "true" ] || [ "$connect" = "true" ] && echo true || echo false )
          needs_dwn_clients=$( [ "$needs_dwn_sdk" = "true" ] || [ "$dwn_clients" = "true" ] && echo true || echo false )
          needs_dwn_sql_store=$( [ "$needs_dwn_sdk" = "true" ] || [ "$dwn_sql_store" = "true" ] && echo true || echo false )
          needs_dwn_server=$( [ "$needs_dwn_sdk" = "true" ] || [ "$needs_dwn_clients" = "true" ] || [ "$needs_dwn_sql_store" = "true" ] || [ "$dwn_server" = "true" ] && echo true || echo false )
          needs_agent=$( [ "$needs_dids" = "true" ] || [ "$needs_dwn_sdk" = "true" ] || [ "$needs_connect" = "true" ] || [ "$needs_dwn_clients" = "true" ] || [ "$agent" = "true" ] && echo true || echo false )
          needs_local_node=$( [ "$needs_agent" = "true" ] || [ "$needs_dwn_server" = "true" ] || [ "$local_node" = "true" ] && echo true || echo false )
          needs_auth=$( [ "$needs_agent" = "true" ] || [ "$auth" = "true" ] && echo true || echo false )
          needs_api=$( [ "$needs_agent" = "true" ] || [ "$needs_auth" = "true" ] || [ "$api" = "true" ] && echo true || echo false )
          needs_cli=$( [ "$needs_api" = "true" ] || [ "$cli" = "true" ] && echo true || echo false )
          needs_lightweight=$( [ "$needs_common_crypto" = "true" ] || [ "$needs_connect" = "true" ] || [ "$needs_auth" = "true" ] || [ "$protocol_codegen" = "true" ] || [ "$needs_cli" = "true" ] || [ "$needs_local_node" = "true" ] && echo true || echo false )
          needs_agent_api_group=$( [ "$needs_dids" = "true" ] || [ "$needs_agent" = "true" ] || [ "$needs_auth" = "true" ] || [ "$needs_api" = "true" ] || [ "$dwn_clients" = "true" ] || [ "$protocols" = "true" ] && echo true || echo false )
          needs_browser_tests=$( [ "$needs_common_crypto" = "true" ] || [ "$needs_dids" = "true" ] || [ "$needs_dwn_sdk" = "true" ] || [ "$needs_agent" = "true" ] || [ "$needs_api" = "true" ] || [ "$browser_pkg" = "true" ] && echo true || echo false )
          needs_e2e=$( [ "$needs_agent" = "true" ] && echo true || echo false )

          # Write outputs
          {
            echo "needs_common_crypto=$needs_common_crypto"
            echo "needs_lightweight=$needs_lightweight"
            echo "needs_dids=$needs_dids"
            echo "needs_dwn_sdk=$needs_dwn_sdk"
            echo "needs_dwn_clients=$needs_dwn_clients"
            echo "needs_dwn_sql_store=$needs_dwn_sql_store"
            echo "needs_dwn_server=$needs_dwn_server"
            echo "needs_agent=$needs_agent"
            echo "needs_local_node=$needs_local_node"
            echo "needs_auth=$needs_auth"
            echo "needs_api=$needs_api"
            echo "needs_agent_api_group=$needs_agent_api_group"
            echo "needs_browser_tests=$needs_browser_tests"
            echo "needs_e2e=$needs_e2e"
          } >> "$GITHUB_OUTPUT"

          echo "Change detection results:"
          echo "  common_crypto=$needs_common_crypto dids=$needs_dids dwn_sdk=$needs_dwn_sdk"
          echo "  dwn_clients=$needs_dwn_clients dwn_sql_store=$needs_dwn_sql_store dwn_server=$needs_dwn_server"
          echo "  agent=$needs_agent local_node=$needs_local_node auth=$needs_auth api=$needs_api protocol_codegen=$protocol_codegen cli=$needs_cli"
          echo "  agent_api_group=$needs_agent_api_group browser=$needs_browser_tests e2e=$needs_e2e"

  # ---------------------------------------------------------------------------
  # Lint: runs in parallel with build for fast feedback (no build needed —
  # ESLint uses project: true which resolves .ts source files via tsconfig).
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: changes
    if: needs.changes.outputs.src == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  # ---------------------------------------------------------------------------
  # Build: runs in parallel with lint, produces workspace-build artifact for
  # downstream test jobs.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.src == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Persist Turbo's local cache across runs so an unchanged package restores
      # its dist/ from cache instead of rebuilding. The sha-suffixed key never
      # hits on restore (each commit is unique), so restore-keys falls back to
      # the most recent prior cache and Turbo rebuilds only what changed —
      # dropping the warm-cache build from ~57s to the delta. Correctness of the
      # cache hit relies on turbo.json globalDependencies covering shared build
      # inputs (root tsconfig, build/); the lockfile and turbo.json are hashed
      # by Turbo automatically.
      - name: Restore Turbo build cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-

      - name: Build
        run: bun run build

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: workspace-build
          path: packages/*/dist/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Lightweight packages: common, crypto, connect, auth, protocol-codegen, cli, local-node
  # (no external services needed)
  # ---------------------------------------------------------------------------
  test-lightweight:
    name: 'Test: common / crypto / connect / auth / cli'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [build, changes]
    if: needs.changes.outputs.needs_lightweight == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Run tests with coverage
        run: |
          bun run --filter @enbox/common  test:node:coverage
          bun run --filter @enbox/crypto  test:node:coverage
          bun run --filter @enbox/connect test:node:coverage
          bun run --filter @enbox/auth    test:node:coverage
          bun run --filter @enbox/protocol-codegen test:node:coverage
          bun run --filter @enbox/cli     test:node:coverage
          bun run --filter @enbox/local-node test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/common/coverage coverage-staging/packages/crypto/coverage coverage-staging/packages/connect/coverage coverage-staging/packages/auth/coverage coverage-staging/packages/protocol-codegen/coverage coverage-staging/packages/cli/coverage coverage-staging/packages/local-node/coverage
          cp packages/common/coverage/lcov.info coverage-staging/packages/common/coverage/lcov.info 2>/dev/null || true
          cp packages/crypto/coverage/lcov.info coverage-staging/packages/crypto/coverage/lcov.info 2>/dev/null || true
          cp packages/connect/coverage/lcov.info coverage-staging/packages/connect/coverage/lcov.info 2>/dev/null || true
          cp packages/auth/coverage/lcov.info coverage-staging/packages/auth/coverage/lcov.info 2>/dev/null || true
          cp packages/protocol-codegen/coverage/lcov.info coverage-staging/packages/protocol-codegen/coverage/lcov.info 2>/dev/null || true
          cp packages/cli/coverage/lcov.info coverage-staging/packages/cli/coverage/lcov.info 2>/dev/null || true
          cp packages/local-node/coverage/lcov.info coverage-staging/packages/local-node/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lightweight
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # DWN SDK: large test suite, but no external services (LevelDB in-process)
  # ---------------------------------------------------------------------------
  test-dwn-sdk:
    name: 'Test: dwn-sdk-js'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [build, changes]
    if: needs.changes.outputs.needs_dwn_sdk == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Run tests with coverage
        run: bun run --filter @enbox/dwn-sdk-js test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/dwn-sdk-js/coverage
          cp packages/dwn-sdk-js/coverage/lcov.info coverage-staging/packages/dwn-sdk-js/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dwn-sdk
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Agent: the largest service-backed suite (~70 spec files). Split two ways via
  # a round-robin file shard so the slow files (sync-engine-level,
  # connect-approval) don't pile up in a single leg. Needs a live Pkarr relay
  # and dwn-server (backed by Postgres). Runs in parallel with test-api-clients.
  # ---------------------------------------------------------------------------
  test-agent:
    name: 'Test: agent (shard ${{ matrix.shard }}/3)'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [build, changes]
    if: needs.changes.outputs.needs_agent == 'true'

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres-dwn-server:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Start Pkarr relay
        run: |
          docker run -d --name pkarr-relay -p 7527:15411 synonymsoft/pkarr-relay pkarr-relay --testnet
          echo "Waiting for Pkarr relay..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7527/ >/dev/null 2>&1 || [ $? -eq 22 ]; then
              echo "Pkarr relay is ready"
              break
            fi
            sleep 2
          done

      - name: Start dwn-server
        run: |
          export DS_PORT=3000
          export DWN_BASE_URL=http://localhost:3000
          export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          # The DWN server itself talks to the local Pkarr relay; opt in to private gateways for
          # this dev/CI process. Production deployments leave this unset.
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          export DWN_RATE_LIMIT_REQUESTS_PER_SECOND=0
          export DWN_RATE_LIMIT_TENANT_REQUESTS_PER_SECOND=0

          bun packages/dwn-server/dist/esm/src/main.js &
          echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for dwn-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/info >/dev/null 2>&1; then
              echo "dwn-server is ready"
              break
            fi
            sleep 2
          done

      - name: Run agent tests with coverage (shard ${{ matrix.shard }}/3)
        run: |
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          # Opt-in for the test process so the agent / DWN can talk to the local Pkarr relay
          # without each call site having to pass `allowPrivateGatewayUri: true`.
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          cd packages/agent
          # Deterministic round-robin split of the non-e2e spec files across the
          # three shards (same file list as the package `test:node:coverage`
          # script, minus tests/e2e/*). Sorting first keeps the split stable.
          mapfile -t all_specs < <(find tests -name '*.spec.ts' -not -path 'tests/e2e/*' | sort)
          shard_specs=()
          for i in "${!all_specs[@]}"; do
            if [ $(( i % 3 )) -eq $(( ${{ matrix.shard }} - 1 )) ]; then
              shard_specs+=("${all_specs[$i]}")
            fi
          done
          echo "Shard ${{ matrix.shard }}/3 running ${#shard_specs[@]} of ${#all_specs[@]} spec files"
          bun test --timeout 10000 --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage "${shard_specs[@]}"

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/agent/coverage-shard-${{ matrix.shard }}
          cp packages/agent/coverage/lcov.info coverage-staging/packages/agent/coverage-shard-${{ matrix.shard }}/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-agent-shard-${{ matrix.shard }}
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: |
          if [ -n "$DWN_SERVER_PID" ]; then
            kill "$DWN_SERVER_PID" || true
          fi
          docker rm -f pkarr-relay || true

  # ---------------------------------------------------------------------------
  # dids + dwn-clients + api + browser (node): the remaining service-backed
  # suites, split off from the agent shards so they run in parallel. Need a live
  # Pkarr relay and dwn-server (backed by Postgres).
  # ---------------------------------------------------------------------------
  test-api-clients:
    name: 'Test: dids / dwn-clients / api'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [build, changes]
    if: needs.changes.outputs.needs_agent_api_group == 'true'

    services:
      postgres-dwn-server:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: dwn
          POSTGRES_USER: dwn_user
          POSTGRES_PASSWORD: dwn_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: packages

      - name: Link @enbox/protocols for api tests
        run: |
          mkdir -p packages/api/node_modules/@enbox
          ln -sf ../../../protocols packages/api/node_modules/@enbox/protocols

      - name: Start Pkarr relay
        run: |
          docker run -d --name pkarr-relay -p 7527:15411 synonymsoft/pkarr-relay pkarr-relay --testnet
          echo "Waiting for Pkarr relay..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:7527/ >/dev/null 2>&1 || [ $? -eq 22 ]; then
              echo "Pkarr relay is ready"
              break
            fi
            sleep 2
          done

      - name: Start dwn-server
        run: |
          export DS_PORT=3000
          export DWN_BASE_URL=http://localhost:3000
          export DWN_TTL_CACHE_URL=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_MESSAGES=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_DATA=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DWN_STORAGE_RESUMABLE_TASKS=postgres://dwn_user:dwn_password@localhost:5433/dwn
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          # The DWN server itself talks to the local Pkarr relay; opt in to private gateways for
          # this dev/CI process. Production deployments leave this unset.
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          export DWN_RATE_LIMIT_REQUESTS_PER_SECOND=0
          export DWN_RATE_LIMIT_TENANT_REQUESTS_PER_SECOND=0

          bun packages/dwn-server/dist/esm/src/main.js &
          echo "DWN_SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for dwn-server..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/info >/dev/null 2>&1; then
              echo "dwn-server is ready"
              break
            fi
            sleep 2
          done

      - name: Run tests with coverage
        run: |
          export DID_DHT_GATEWAY_URI=http://localhost:7527
          # Opt-in for the test process so the agent / DWN can talk to the local Pkarr relay
          # without each call site having to pass `allowPrivateGatewayUri: true`.
          export DID_DHT_ALLOW_PRIVATE_GATEWAY=1
          bun run --filter @enbox/dids         test:node:coverage
          bun run --filter @enbox/dwn-clients  test:node:coverage
          bun run --filter @enbox/api          test:node:coverage
          bun run --filter @enbox/browser      test:node:coverage

      - name: Stage coverage
        if: always()
        run: |
          mkdir -p coverage-staging/packages/dids/coverage coverage-staging/packages/dwn-clients/coverage coverage-staging/packages/api/coverage coverage-staging/packages/browser/coverage
          cp packages/dids/coverage/lcov.info coverage-staging/packages/dids/coverage/lcov.info 2>/dev/null || true
          cp packages/dwn-clients/coverage/lcov.info coverage-staging/packages/dwn-clients/coverage/lcov.info 2>/dev/null || true
          cp packages/api/coverage/lcov.info coverage-staging/packages/api/coverage/lcov.info 2>/dev/null || true
          cp packages/browser/coverage/lcov.info coverage-staging/packages/browser/coverage/lcov.info 2>/dev/null || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-clients
          path: coverage-staging/
          retention-days: 1
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: |
          if [ -n "$DWN_SERVER_PID" ]; then
            kill "$DWN_SERVER_PID" || true
          fi
          docker rm -f pkarr-relay || true

