name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude AI Review
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: get-diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          DIFF=$(git diff origin/${{ github.event.pull_request.base.ref }}..HEAD)
          # Save diff to file to avoid issues with special characters
          echo "$DIFF" > pr_diff.txt
          echo "diff_file=pr_diff.txt" >> $GITHUB_OUTPUT

      - name: Get changed files
        id: changed-files
        run: |
          FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}..HEAD | head -20)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Review with Claude
        id: claude-review
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            
            // Read PR diff
            const diff = fs.readFileSync('pr_diff.txt', 'utf8');
            const files = `${{ steps.changed-files.outputs.files }}`;
            
            // Read context files if they exist
            let contextContent = '';
            const contextFiles = ['README.md', 'AGENT_CONTEXT.md'];
            for (const file of contextFiles) {
              try {
                const content = fs.readFileSync(file, 'utf8');
                contextContent += `\n### ${file}\n${content}\n`;
              } catch (e) {
                // File doesn't exist, skip
              }
            }
            
            const prompt = `You are a Principal Engineer reviewing a pull request. Analyze the changes and provide a comprehensive technical review.

            ## Repository Context
            ${contextContent}

            ## PR Information
            Title: ${{ github.event.pull_request.title }}
            Description: ${{ github.event.pull_request.body || 'No description provided' }}
            Author: ${{ github.event.pull_request.user.login }}

            ## Changed Files
            ${files}

            ## Diff (truncated if too large)
            ${diff.substring(0, 30000)}

            ## Review Guidelines

            Provide a technical assessment covering:

            1. **Summary**: What does this PR do in 2-3 sentences?

            2. **Code Quality** (A/B/C/D/F rating):
               - Readability and maintainability
               - Following established patterns
               - Appropriate abstractions

            3. **Issues Found**:
               - List specific problems with file and line references
               - Security vulnerabilities
               - Performance concerns
               - Logic errors

            4. **Suggestions**:
               - Specific improvements with examples
               - Better approaches if applicable

            5. **Merge Recommendation**:
               - APPROVE: Ready to merge
               - REQUEST CHANGES: Needs fixes (list blockers)
               - COMMENT: Minor suggestions, can merge

            Be direct and specific. Focus on significant issues that impact functionality, security, or maintainability.`;

            // Call Claude API
            const requestData = JSON.stringify({
              model: 'claude-3-opus-20240229',
              max_tokens: 4000,
              temperature: 0.3,
              messages: [{
                role: 'user',
                content: prompt
              }]
            });

            const options = {
              hostname: 'api.anthropic.com',
              path: '/v1/messages',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              }
            };

            try {
              const response = await new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = '';
                  res.on('data', (chunk) => data += chunk);
                  res.on('end', () => {
                    try {
                      resolve(JSON.parse(data));
                    } catch (e) {
                      reject(new Error(`Failed to parse response: ${e.message}`));
                    }
                  });
                });
                req.on('error', reject);
                req.write(requestData);
                req.end();
              });

              if (response.content && response.content[0]) {
                const review = response.content[0].text;
                
                // Post review comment
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## 🤖 Claude AI Code Review\n\n${review}`
                });
                
                console.log('Review posted successfully');
              } else {
                throw new Error('No content in Claude response');
              }
            } catch (error) {
              console.error('Error:', error);
              
              // Post error comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ❌ AI Review Error\n\nFailed to generate code review. Please check the action logs for details.`
              });
            }