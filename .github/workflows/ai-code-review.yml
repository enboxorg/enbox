name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude AI Review
    steps:
      - uses: anthropics/claude-code-action@beta
        name: Claude Code Review
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-opus-4-20250514"
          max_tokens: 8192
          temperature: 0.3
          context_size_chars: 30000
          disable_send_context: false
          settings: |
            {
              "env": {
                "REVIEW_TYPE": "principal-engineer"
              },
              "permissions": {
                "allow": ["Read", "Bash"],
                "deny": ["WebFetch", "Write"]
              },
              "hooks": {
                "PreToolUse": [{
                  "matcher": "Read",
                  "hooks": [{
                    "type": "log",
                    "message": "Reading file for code review..."
                  }]
                }]
              }
            }
          prompt: |
            You are a Principal Engineer reviewing this pull request. Provide a comprehensive technical assessment focused on code quality, architecture, and scope management.

            ## Context Files to Read First

            Please read these files to understand the codebase context:
            - README.md
            - AGENT_CONTEXT.md (if exists)
            - GETTING_STARTED.md (if exists)
            - Any package.json files in the root and packages/* directories

            ## Review Process

            1. **Understand the Codebase**: Start by reading the context files above to understand the project structure, patterns, and standards.

            2. **Analyze the PR**: Review all changed files in this pull request.

            3. **File-by-File Review**: For each significant file change, provide:
               - Pattern adherence analysis
               - Code quality assessment
               - Architecture fit evaluation
               - Potential issues or improvements
               - Security and performance considerations

            4. **Overall Assessment**: Provide a technical assessment covering:
               
               **Scope Analysis**:
               - Is this PR doing what it claims and ONLY what it claims?
               - Are there hidden features or unrelated changes?
               - Is the scope appropriately sized or should it be split?
               - Are we fixing things that aren't broken?

               **Code Quality Assessment**:
               - Rate the code quality objectively (A/B/C/D/F)
               - What are the main quality issues if any?
               - Is this following established patterns?
               - Is the solution appropriately simple or over-engineered?

               **Technical Debt Impact**:
               - What debt is being created?
               - What debt is being paid down?
               - Net impact on codebase maintainability?
               - Will we regret this in 6 months?

               **Risk Assessment**:
               - Production risks (be specific)
               - Security concerns
               - Performance implications
               - Breaking changes or compatibility issues

               **Merge Decision**:
               - READY TO MERGE or NOT READY (no maybe)
               - If not ready, list specific blockers
               - Are the blockers must-fix or nice-to-have?

            Be technically precise and direct. Focus on what matters for long-term codebase health. Call out scope creep immediately. If it's good code that solves the problem simply, say so.

            Format your response as a PR comment with clear sections and actionable feedback.