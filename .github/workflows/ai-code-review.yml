name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    name: Claude AI Review
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Details
        id: pr-details
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });
            
            // Filter for reviewable files
            const reviewableFiles = files.filter(file => {
              const ext = file.filename.split('.').pop();
              const reviewableExts = ['js', 'jsx', 'ts', 'tsx', 'py', 'java', 'go', 'rs', 'rb', 'php', 'cs', 'cpp', 'c', 'h', 'swift', 'kt'];
              return reviewableExts.includes(ext) && file.status !== 'removed';
            });
            
            core.setOutput('files', JSON.stringify(reviewableFiles));
            core.setOutput('file_count', reviewableFiles.length);

      - name: Review Changed Files
        if: steps.pr-details.outputs.file_count > 0
        uses: actions/github-script@v7
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        with:
          script: |
            const https = require('https');
            const files = JSON.parse('${{ steps.pr-details.outputs.files }}');
            
            // Helper function to call Claude API
            async function callClaude(prompt) {
              const requestData = JSON.stringify({
                model: 'claude-3-opus-20240229',
                max_tokens: 4000,
                temperature: 0.7,
                messages: [{
                  role: 'user',
                  content: prompt
                }]
              });
              
              const options = {
                hostname: 'api.anthropic.com',
                path: '/v1/messages',
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-api-key': process.env.CLAUDE_API_KEY,
                  'anthropic-version': '2023-06-01'
                }
              };
              
              return new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = '';
                  res.on('data', (chunk) => data += chunk);
                  res.on('end', () => {
                    try {
                      const response = JSON.parse(data);
                      resolve(response);
                    } catch (e) {
                      reject(new Error(`Failed to parse response: ${e.message}`));
                    }
                  });
                });
                req.on('error', reject);
                req.write(requestData);
                req.end();
              });
            }
            
            // Review each file
            const reviews = [];
            for (const file of files.slice(0, 10)) { // Limit to 10 files to avoid timeout
              try {
                console.log(`Reviewing ${file.filename}...`);
                
                // Get file content with context
                const { data: prFile } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: file.filename,
                  ref: context.payload.pull_request.head.sha
                });
                
                const content = Buffer.from(prFile.content, 'base64').toString('utf8');
                
                const prompt = `You are an expert code reviewer. Review this code and its changes.

                File: ${file.filename}
                Status: ${file.status}
                Additions: ${file.additions} lines
                Deletions: ${file.deletions} lines

                Patch (changes):
                ${file.patch || 'No patch available'}

                Full file content (for context):
                ${content.slice(0, 10000)} ${content.length > 10000 ? '... (truncated)' : ''}

                Please provide:
                1. A summary of what this change does
                2. Any bugs, issues, or concerns you notice
                3. Suggestions for improvement
                4. Security considerations if applicable
                5. Code quality and best practices feedback

                Be specific and actionable. If the code looks good, say so. Focus on the most important issues.`;

                const response = await callClaude(prompt);
                
                if (response.content && response.content[0]) {
                  reviews.push({
                    file: file.filename,
                    review: response.content[0].text
                  });
                }
              } catch (error) {
                console.error(`Error reviewing ${file.filename}:`, error.message);
                reviews.push({
                  file: file.filename,
                  review: `⚠️ Error during review: ${error.message}`
                });
              }
            }
            
            // Create a comprehensive review comment
            if (reviews.length > 0) {
              let comment = `## 🤖 Claude AI Code Review\n\n`;
              comment += `I've reviewed **${reviews.length}** file(s) in this PR. `;
              comment += `Here's my analysis:\n\n`;
              
              for (const review of reviews) {
                comment += `### 📄 ${review.file}\n\n`;
                comment += `${review.review}\n\n`;
                comment += `---\n\n`;
              }
              
              // Post the review
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

      - name: PR Summary
        uses: actions/github-script@v7
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        with:
          script: |
            const https = require('https');
            
            // Get PR info
            const pr = context.payload.pull_request;
            const { data: diff } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              mediaType: {
                format: 'diff'
              }
            });
            
            const prompt = `You are reviewing a pull request. Provide a high-level summary and assessment.

            PR Title: ${pr.title}
            PR Description: ${pr.body || 'No description provided'}
            
            Diff (first 15000 chars):
            ${diff.substring(0, 15000)}

            Please provide:
            1. A concise summary of what this PR accomplishes
            2. The overall quality assessment
            3. Key risks or concerns
            4. Whether this PR is ready to merge or needs work
            5. Any architectural or design feedback

            Keep it concise but thorough. This is the overview that will help reviewers understand the PR quickly.`;

            const requestData = JSON.stringify({
              model: 'claude-3-opus-20240229',
              max_tokens: 2000,
              temperature: 0.7,
              messages: [{
                role: 'user',
                content: prompt
              }]
            });
            
            const options = {
              hostname: 'api.anthropic.com',
              path: '/v1/messages',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.CLAUDE_API_KEY,
                'anthropic-version': '2023-06-01'
              }
            };
            
            try {
              const response = await new Promise((resolve, reject) => {
                const req = https.request(options, (res) => {
                  let data = '';
                  res.on('data', (chunk) => data += chunk);
                  res.on('end', () => resolve(JSON.parse(data)));
                });
                req.on('error', reject);
                req.write(requestData);
                req.end();
              });
              
              if (response.content && response.content[0]) {
                const summaryComment = `## 🎯 PR Summary by Claude\n\n${response.content[0].text}\n\n---\n*This is an AI-generated summary. Please verify all suggestions and feedback.*`;
                
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: summaryComment
                });
              }
            } catch (error) {
              console.error('Error creating summary:', error.message);
            }