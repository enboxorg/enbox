name: AI Architecture & Design Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.js'
      - '**.ts'
      - '**.jsx'
      - '**.tsx'
      - '**.py'
      - '**.java'
      - '**.go'
      - '**.rs'
      - 'package.json'
      - '**/package.json'
      - 'requirements.txt'
      - 'go.mod'
      - 'Cargo.toml'

permissions:
  contents: read
  pull-requests: write

jobs:
  architecture-analysis:
    runs-on: ubuntu-latest
    name: Architecture & Design Patterns Review
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Analysis Tools
        run: |
          pip install radon matplotlib networkx pydot graphviz
          npm install -g madge dependency-cruiser

      - name: Analyze Code Architecture
        id: architecture-analysis
        run: |
          echo "## 🏗️ Architecture Analysis Report" > architecture_report.md
          echo "" >> architecture_report.md
          
          # Cyclomatic Complexity Analysis
          echo "### Cyclomatic Complexity" >> architecture_report.md
          echo "" >> architecture_report.md
          
          # Python complexity
          if find . -name "*.py" -not -path "./venv/*" -not -path "./.venv/*" | head -1 | grep -q .; then
            echo "#### Python Files" >> architecture_report.md
            radon cc . -a -nb >> architecture_report.md || true
            echo "" >> architecture_report.md
          fi
          
          # JavaScript/TypeScript module dependencies
          if [ -f "package.json" ]; then
            echo "### Module Dependencies" >> architecture_report.md
            echo "" >> architecture_report.md
            
            # Generate dependency graph
            madge --circular --warning . > circular_deps.txt 2>&1 || true
            if [ -s circular_deps.txt ]; then
              echo "#### ⚠️ Circular Dependencies Detected" >> architecture_report.md
              cat circular_deps.txt >> architecture_report.md
              echo "" >> architecture_report.md
            fi
            
            # Dependency cruiser analysis
            if [ ! -f ".dependency-cruiser.json" ]; then
              echo '{
                "forbidden": [
                  {
                    "name": "no-circular",
                    "severity": "error",
                    "comment": "Circular dependencies",
                    "from": {},
                    "to": {
                      "circular": true
                    }
                  },
                  {
                    "name": "no-orphans",
                    "severity": "warn",
                    "comment": "Orphaned files",
                    "from": {
                      "orphan": true,
                      "pathNot": "\\.d\\.ts$"
                    }
                  }
                ]
              }' > .dependency-cruiser.json
            fi
            
            npx depcruise --config .dependency-cruiser.json --output-type err src 2>&1 | tee -a architecture_report.md || true
          fi

      - name: AI Design Pattern Analysis
        uses: actions/github-script@v7
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        with:
          script: |
            const fs = require('fs');
            const https = require('https');
            
            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            
            const codeFiles = files.filter(f => 
              f.filename.match(/\.(js|ts|jsx|tsx|py|java|go|rs)$/) && 
              f.status !== 'removed'
            );
            
            let designReport = '## 🎨 Claude Architecture & Design Review\n\n';
            
            // Analyze overall structure
            if (codeFiles.length > 0) {
              const fileStructure = codeFiles.map(f => f.filename).join('\n');
              
              const structurePrompt = `You are a senior software architect. Analyze this pull request's file structure and provide architectural insights.
              
              Files changed:
              ${fileStructure}
              
              Please analyze:
              1. Design patterns being used or violated
              2. Architecture concerns (coupling, cohesion, separation of concerns)
              3. SOLID principles adherence
              4. Potential code smells
              5. Scalability and maintainability concerns
              6. Suggestions for improvement
              
              Provide a concise but thorough analysis in markdown format.`;
              
              try {
                const requestData = JSON.stringify({
                  model: 'claude-3-opus-20240229',
                  max_tokens: 2000,
                  temperature: 0.7,
                  messages: [{
                    role: 'user',
                    content: structurePrompt
                  }]
                });
                
                const options = {
                  hostname: 'api.anthropic.com',
                  path: '/v1/messages',
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': process.env.CLAUDE_API_KEY,
                    'anthropic-version': '2023-06-01'
                  }
                };
                
                const response = await new Promise((resolve, reject) => {
                  const req = https.request(options, (res) => {
                    let data = '';
                    res.on('data', (chunk) => data += chunk);
                    res.on('end', () => resolve(JSON.parse(data)));
                  });
                  req.on('error', reject);
                  req.write(requestData);
                  req.end();
                });
                
                if (response.content && response.content[0]) {
                  designReport += response.content[0].text + '\n\n';
                }
              } catch (error) {
                console.error('Error in architecture analysis:', error.message);
                designReport += '⚠️ Error analyzing architecture patterns\n\n';
              }
              
              // Analyze specific patterns in larger files
              for (const file of codeFiles.slice(0, 3)) { // Limit to 3 files
                if (file.additions > 50) {
                  try {
                    const { data: content } = await github.rest.repos.getContent({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      path: file.filename,
                      ref: context.payload.pull_request.head.sha,
                    });
                    
                    const code = Buffer.from(content.content, 'base64').toString();
                    
                    const patternPrompt = `Analyze this code for design patterns, architectural issues, and code quality.
                    
                    File: ${file.filename}
                    Code snippet (first 150 lines):
                    ${code.split('\n').slice(0, 150).join('\n')}
                    
                    Identify:
                    1. Design patterns used
                    2. Anti-patterns present
                    3. Code smells
                    4. Performance concerns
                    5. Specific suggestions for improvement
                    
                    Be specific and actionable in your recommendations.`;
                    
                    const patternRequestData = JSON.stringify({
                      model: 'claude-3-opus-20240229',
                      max_tokens: 1200,
                      temperature: 0.7,
                      messages: [{
                        role: 'user',
                        content: patternPrompt
                      }]
                    });
                    
                    const patternOptions = {
                      hostname: 'api.anthropic.com',
                      path: '/v1/messages',
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': process.env.CLAUDE_API_KEY,
                        'anthropic-version': '2023-06-01'
                      }
                    };
                    
                    const patternResponse = await new Promise((resolve, reject) => {
                      const req = https.request(patternOptions, (res) => {
                        let data = '';
                        res.on('data', (chunk) => data += chunk);
                        res.on('end', () => resolve(JSON.parse(data)));
                      });
                      req.on('error', reject);
                      req.write(patternRequestData);
                      req.end();
                    });
                    
                    if (patternResponse.content && patternResponse.content[0]) {
                      designReport += `### ${file.filename}\n${patternResponse.content[0].text}\n\n`;
                    }
                  } catch (error) {
                    console.error(`Error analyzing ${file.filename}:`, error.message);
                  }
                }
              }
            }
            
            // Post the report
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: designReport
            });

      - name: Code Metrics Analysis
        run: |
          echo "## 📊 Code Metrics" > metrics_report.md
          echo "" >> metrics_report.md
          
          # Lines of code analysis
          echo "### Lines of Code by Language" >> metrics_report.md
          find . -type f \( -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" -o -name "*.py" -o -name "*.java" -o -name "*.go" -o -name "*.rs" \) -not -path "*/node_modules/*" -not -path "*/.git/*" | xargs wc -l | sort -rn | head -20 >> metrics_report.md || true
          echo "" >> metrics_report.md
          
          # File count by type
          echo "### File Distribution" >> metrics_report.md
          echo "| Extension | Count |" >> metrics_report.md
          echo "|-----------|-------|" >> metrics_report.md
          for ext in js ts jsx tsx py java go rs; do
            count=$(find . -name "*.$ext" -not -path "*/node_modules/*" -not -path "*/.git/*" | wc -l)
            if [ $count -gt 0 ]; then
              echo "| .$ext | $count |" >> metrics_report.md
            fi
          done

      - name: Post Reports
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Combine all reports
            let finalReport = '';
            
            const reports = ['architecture_report.md', 'metrics_report.md'];
            for (const report of reports) {
              if (fs.existsSync(report)) {
                finalReport += fs.readFileSync(report, 'utf8') + '\n\n';
              }
            }
            
            if (finalReport.trim()) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: finalReport
              });
            }