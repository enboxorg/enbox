name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '*.md'
      - 'packages/**/*.md'
      # NOTE: .changeset/*.md is intentionally NOT ignored — changesets are .md
      # files and must trigger this workflow for version PRs to be created.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      # Mint a short-lived installation token from the release GitHub App. We
      # cannot use the default `GITHUB_TOKEN` because pushes/PRs made with it
      # do not trigger downstream workflows (recursion prevention), which means
      # the `CI Passed` required check is never produced on the version PR and
      # it stays permanently `BLOCKED`. The App acts as a distinct identity, so
      # its commits/PR updates do trigger `ci.yml` normally.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # Stored as a secret (not a variable) for setup convenience — the
          # value isn't actually sensitive (Client IDs are visible on the App's
          # public settings page) but treating it as a secret is harmless.
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Persist App credentials so any `git push` performed by the
          # `version` / `release` scripts uses the App identity, not
          # `github-actions[bot]`.
          token: ${{ steps.app-token.outputs.token }}
          # Reconciliation compares package versions with the release commit's parent.
          fetch-depth: 2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Restore bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: ./scripts/ci-install.sh

      - name: Audit locked dependencies
        run: bun run security:audit

      - name: Create Release PR or Publish
        id: changesets
        # Keep the action aligned with Changesets CLI v3.
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Use the App identity so version PR commits trigger CI.
          github-token: ${{ steps.app-token.outputs.token }}
          push-with-git-cli: true
          # Registry-bound reconciliation below owns retry-safe tags and releases.
          create-github-releases: false
          push-git-tags: false
          # Uses bun pack + npm publish (via scripts/publish.sh) instead of
          # changeset publish because changeset publish calls npm publish on the
          # raw package dir, which does NOT resolve Bun's workspace:* protocol.
          # See: https://github.com/oven-sh/bun/issues/24124
          publish-script: bun run release
          # The version script runs changeset version then bun install to
          # regenerate the lockfile so workspace:* resolves to new versions.
          version-script: bun run version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          # The changelog plugin also needs this token in the version script.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Reconcile published tags and GitHub releases
        if: always() && !cancelled() && steps.changesets.outputs.has-changesets == 'false'
        run: bun scripts/reconcile-release.mjs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
