name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'LICENSE'
      - '*.md'
      - 'packages/**/*.md'
      # NOTE: .changeset/*.md is intentionally NOT ignored — changesets are .md
      # files and must trigger this workflow for version PRs to be created.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      # Mint a short-lived installation token from the release GitHub App. We
      # cannot use the default `GITHUB_TOKEN` because pushes/PRs made with it
      # do not trigger downstream workflows (recursion prevention), which means
      # the `CI Passed` required check is never produced on the version PR and
      # it stays permanently `BLOCKED`. The App acts as a distinct identity, so
      # its commits/PR updates do trigger `ci.yml` normally.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Persist App credentials so any `git push` performed by the
          # `version` / `release` scripts uses the App identity, not
          # `github-actions[bot]`.
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # Uses bun pack + npm publish (via scripts/publish.sh) instead of
          # changeset publish because changeset publish calls npm publish on the
          # raw package dir, which does NOT resolve Bun's workspace:* protocol.
          # See: https://github.com/oven-sh/bun/issues/24124
          publish: bun run release
          # The version script runs changeset version then bun install to
          # regenerate the lockfile so workspace:* resolves to new versions.
          version: bun run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          # App token (not GITHUB_TOKEN) so the version PR's commits trigger
          # `ci.yml` and produce the required `CI Passed` status check.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # bun publish reads the npm token from bunfig or NPM_CONFIG_TOKEN
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
