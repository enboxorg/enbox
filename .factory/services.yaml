commands:
  install: bun install
  build: bun run --filter @enbox/dwn-sdk-js build && bun run --filter @enbox/agent build
  test: cd packages/agent && bun run test:node
  lint: bun run lint

services:
  pkarr-relay:
    start: docker compose -f docker-compose.test.yaml up -d pkarr-relay
    stop: docker compose -f docker-compose.test.yaml stop pkarr-relay
    healthcheck: curl -sf http://localhost:7527 || nc -zv localhost 7527
    port: 7527
    depends_on: []

  postgres-dwn:
    start: docker compose -f docker-compose.test.yaml up -d postgres
    stop: docker compose -f docker-compose.test.yaml stop postgres
    healthcheck: docker compose -f docker-compose.test.yaml exec -T postgres pg_isready -U dwn_user
    port: 5433
    depends_on: []

  postgres-sdk:
    start: docker compose -f docker-compose.test.yaml up -d postgres-sdk
    stop: docker compose -f docker-compose.test.yaml stop postgres-sdk
    healthcheck: docker compose -f docker-compose.test.yaml exec -T postgres-sdk pg_isready
    port: 5432
    depends_on: []

  mysql:
    start: docker compose -f docker-compose.test.yaml up -d mysql
    stop: docker compose -f docker-compose.test.yaml stop mysql
    healthcheck: docker compose -f docker-compose.test.yaml exec -T mysql mysqladmin ping -h localhost --silent
    port: 3306
    depends_on: []

  nats:
    start: docker compose -f docker-compose.test.yaml up -d nats
    stop: docker compose -f docker-compose.test.yaml stop nats
    healthcheck: nc -zv localhost 4222
    port: 4222
    depends_on: []

  dwn-server:
    start: |
      export DID_DHT_GATEWAY_URI=http://localhost:7527 \
        DS_PORT=3000 \
        DWN_BASE_URL=http://localhost:3000 \
        DWN_TTL_CACHE_URL="postgres://dwn_user:dwn_password@localhost:5433/dwn" \
        DWN_STORAGE_MESSAGES="postgres://dwn_user:dwn_password@localhost:5433/dwn" \
        DWN_STORAGE_DATA="postgres://dwn_user:dwn_password@localhost:5433/dwn" \
        DWN_STORAGE_RESUMABLE_TASKS="postgres://dwn_user:dwn_password@localhost:5433/dwn" && \
      nohup bun packages/dwn-server/dist/esm/src/main.js > /tmp/dwn-server.log 2>&1 &
    stop: lsof -ti :3000 | xargs -r kill
    healthcheck: curl -sf http://localhost:3000/info
    port: 3000
    depends_on: [postgres-dwn, pkarr-relay]
