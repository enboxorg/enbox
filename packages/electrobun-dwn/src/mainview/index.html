<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enbox DWN Server</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: #e2e8f0;
      background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      max-width: 560px;
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(2, 6, 23, 0.5);
    }

    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 8px rgba(74, 222, 128, 0.4);
      flex-shrink: 0;
    }

    .status-dot.offline {
      background: #f87171;
      box-shadow: 0 0 8px rgba(248, 113, 113, 0.4);
    }

    .status-text {
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .status-text a {
      color: #93c5fd;
      text-decoration: none;
    }

    .status-text a:hover {
      text-decoration: underline;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      padding: 12px 14px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.1);
      border-radius: 8px;
    }

    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 0.85rem;
      color: #e2e8f0;
      font-family: "SF Mono", "Fira Code", monospace;
    }

    .notes {
      font-size: 0.8rem;
      color: #64748b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Enbox DWN</div>
    <div class="subtitle">Local Decentralized Web Node</div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <div class="status-text">
        <span id="status">Connecting...</span>
        <a id="server-url" href="#" target="_blank" rel="noreferrer"></a>
      </div>
    </div>

    <div class="info-grid">
      <div class="info-item">
        <div class="info-label">Endpoint</div>
        <div class="info-value" id="endpoint">--</div>
      </div>
      <div class="info-item">
        <div class="info-label">Server</div>
        <div class="info-value" id="server-name">--</div>
      </div>
      <div class="info-item">
        <div class="info-label">Version</div>
        <div class="info-value" id="server-version">--</div>
      </div>
      <div class="info-item">
        <div class="info-label">WebSocket</div>
        <div class="info-value" id="ws-support">--</div>
      </div>
    </div>

    <div class="notes">
      Close this window to stop the server. The DWN uses ports 3000, then 55500-55509.
    </div>
  </div>
  <script type="module" src="./index.js"></script>
</body>
</html>
