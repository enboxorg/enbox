version: '3'

services:

  dwn-server:
    container_name: dwn-server
    # The Dockerfile copies workspace-root files, so the build context must be the
    # repo root, not this package directory.
    build:
      context: ../..
      dockerfile: packages/dwn-server/Dockerfile
    ports:
      - ${DWN_SERVER_PORT:-3000}:3000
    volumes:
      # The default level://data store lives under the server's working directory.
      - ./dwn-server:/app/packages/dwn-server/data
    environment:
      - DWN_REGISTRATION_STORE_URL=
      - DWN_STORAGE=
