replicaCount: 1 # do not override this unless you want to run a headless service and put your own reverse proxy in front
nameOverride: ''
fullnameOverride: ''

# No official public image is published yet. Build the image from the repo
# (docker build -f packages/dwn-server/Dockerfile -t <your-image> .), push it to a
# registry your cluster can pull from, and override image.repository/image.tag here.
image:
  repository: ghcr.io/enboxorg/dwn-server
  tag: main
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: dwn.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - hosts:
  #   - dwn.example.com
  #   secretName: dwn-tls

virtualService:
  enabled: false
  host: dwn.example.com
  gateway: istio-system/primary-gateway

persistence:
  size: 1Gi
  storageClass: ''

resources:
  requests:
    cpu: 100m
    memory: 500Mi

# tolerations:
# affinity:
# topologySpreadConstraints:
# nodeSelector:

customLabels: {}

env:
  DS_PORT: 3000
  MAX_RECORD_DATA_SIZE: '1gb'
  DS_WEBSOCKET_SERVER: 'on'
