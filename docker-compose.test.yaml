version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: enbox-test-postgres
    environment:
      POSTGRES_DB: dwn
      POSTGRES_USER: dwn_user
      POSTGRES_PASSWORD: dwn_password
      POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwn_user -d dwn"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  postgres-sdk:
    image: postgres:13.3
    container_name: enbox-test-postgres-sdk
    environment:
      POSTGRES_DB: dwn
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dwn
      POSTGRES_INITDB_ARGS: '--lc-collate=C --lc-ctype=C'
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d dwn"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  mysql:
    image: mysql:8.0
    container_name: enbox-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: dwn
      MYSQL_DATABASE: dwn
      MYSQL_ALLOW_EMPTY_PASSWORD: "true"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/mysql
  pkarr-relay:
    image: synonymsoft/pkarr
    container_name: enbox-test-pkarr
    command: ["pkarr-relay", "--testnet"]
    ports:
      - "7527:15411"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:15411/ || exit 0"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s
