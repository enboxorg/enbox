# Fly.io configuration for enbox DWN Server
# See https://fly.io/docs/reference/configuration/ for reference

app = "enbox-dwn"
primary_region = "iad"

[build]
  dockerfile = "packages/dwn-server/Dockerfile"

[env]
  DS_PORT = "8080"
  DWN_BASE_URL = "https://enbox-dwn.fly.dev"
  DS_WEBSOCKET_SERVER = "on"
  MAX_RECORD_DATA_SIZE = "1gb"
  DWN_SERVER_LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "10s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
