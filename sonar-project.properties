# ─── Rule-specific issue ignores ──────────────────────────────────────────
#
# Each entry below documents a case where a Sonar rule produces a false
# positive against an intentional pattern in this codebase. Ignores are
# scoped as narrowly as possible (single file) so the rule keeps catching
# real issues elsewhere.
#
# Whenever you add an entry here:
#   1. Empirically verify the rule is wrong (remove the cast / change the
#      code, confirm `bun run build` fails or behavior breaks).
#   2. Add an inline code comment at the offending site explaining why.
#   3. Add the multicriteria entry below with a short note.
#
# Removing an entry is just as important — if a refactor eliminates the
# pattern, drop the suppression so the rule fires again.

# File-level ignores are used ONLY when the SAME false-positive pattern
# recurs many times in one file (e.g. a structural bridge cast at every
# CRUD method, or a shared error-throwing helper). For one-off false
# positives — a single cast in a file with no other instances — prefer
# inline `// NOSONAR` at the cast site (see
# `packages/auth/src/auth-manager.ts:541` and
# `packages/auth/src/connect/restore.ts:401` for examples). The inline
# form is strictly better because future NEW S4325 issues in the same
# file are still reported.

sonar.issue.ignore.multicriteria=s4325Repository,s7786ConnectProtocol,s2187StoreDependentTests,s2187SqlTestSuite

# S4325 (typescript:S4325): "This assertion is unnecessary since the
# receiver accepts the original type of the expression."
#
# Repository proxy in `packages/api/src/repository.ts` has ~13 instances
# of `options as never` — the canonical bridge between the type-erased
# proxy (which only knows `Record<string, unknown>`) and the strictly-
# typed `records.*` methods (which take per-protocol generics). `never`
# is the universal subtype; removing it produces TS2345 at every call
# site because `Record<string, unknown>` is structurally incompatible
# with `TypedRecordCreateParams<...>` etc. Sonar's rule doesn't model
# generic-parameter constraints. File-level ignore is appropriate here
# because every CRUD method uses the same pattern; inline `// NOSONAR`
# at every site would dwarf the actual code. See the header comment in
# `packages/api/src/repository.ts` for the deliberate-pattern callout.
sonar.issue.ignore.multicriteria.s4325Repository.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.s4325Repository.resourceKey=packages/api/src/repository.ts

# S7786 (typescript:S7786): "`new Error()` is too unspecific for a type
# check. Use `new TypeError()` instead."
#
# The `assertConnect*` validators in
# `packages/agent/src/enbox-connect-protocol.ts` throw plain `Error` on
# JWT-payload shape mismatch via a shared `fail(context, field, reason)`
# helper. Sonar would prefer `TypeError`, which is semantically
# defensible — the failures are runtime type-shape mismatches. We keep
# `Error` deliberately so boundary-validation errors propagate through
# the same error pipeline as every other connect-flow failure (downstream
# `catch` blocks don't need to special-case a TypeError subclass). The
# deliberate-pattern callout is in the JSDoc above `fail()`.
sonar.issue.ignore.multicriteria.s7786ConnectProtocol.ruleKey=typescript:S7786
sonar.issue.ignore.multicriteria.s7786ConnectProtocol.resourceKey=packages/agent/src/enbox-connect-protocol.ts

# S2187 (typescript:S2187): "Add some tests to this file or delete it."
#
# Both files DO run tests, but via a shared parameterized suite
# (`TestSuite.runInjectableDependentTests(...)`) whose `it()` cases live in a
# helper module. Sonar's static analysis can't see through that indirection, so
# it false-positives. The files must keep their `.spec.ts` name so `bun test`
# discovers them, so a scoped ignore is the correct fix rather than a rename.
# See the header comment at the top of each file.
sonar.issue.ignore.multicriteria.s2187StoreDependentTests.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187StoreDependentTests.resourceKey=packages/dwn-sdk-js/tests/store-dependent-tests.spec.ts
sonar.issue.ignore.multicriteria.s2187SqlTestSuite.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.s2187SqlTestSuite.resourceKey=packages/dwn-sql-store/tests/test-suite.spec.ts
