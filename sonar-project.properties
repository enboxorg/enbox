# ─── Rule-specific issue ignores ──────────────────────────────────────────
#
# Each entry below documents a case where a Sonar rule produces a false
# positive against an intentional pattern in this codebase. Ignores are
# scoped as narrowly as possible (single file) so the rule keeps catching
# real issues elsewhere.
#
# Whenever you add an entry here:
#   1. Empirically verify the rule is wrong (remove the cast / change the
#      code, confirm `bun run build` fails or behavior breaks).
#   2. Add an inline code comment at the offending site explaining why.
#   3. Add the multicriteria entry below with a short note.
#
# Removing an entry is just as important — if a refactor eliminates the
# pattern, drop the suppression so the rule fires again.

sonar.issue.ignore.multicriteria=s4325Repository,s4325AuthManager,s4325Restore,s7786ConnectProtocol

# S4325: "This assertion is unnecessary since the receiver accepts the
# original type of the expression."
#
# Repository proxy: `options as never` is the canonical bridge between the
# type-erased proxy (which only knows `Record<string, unknown>`) and the
# strictly-typed `records.*` methods (which take per-protocol generics).
# `never` is the universal subtype; removing it produces TS2345 errors at
# every call site because `Record<string, unknown>` is structurally
# incompatible with `TypedRecordCreateParams<...>` etc. Sonar's rule
# doesn't model generic-parameter constraints, so it reports the cast as
# useless. It isn't.
sonar.issue.ignore.multicriteria.s4325Repository.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.s4325Repository.resourceKey=packages/api/src/repository.ts

# S4325 (variant "...does not change the type of the expression"):
# Wire-format destructuring in revocation grant sends. `RecordsWriteMessage`
# doesn't declare `encodedData`, but the wire-format reply may include it
# (the bytes are separately delivered as `data: Blob`). The cast to
# `RecordsWriteMessage & { encodedData?: string }` adds the optional field
# so the `const { encodedData: _encoded, ...rawMessage } = ...` destructuring
# type-checks. Removing it fails with TS2339. Sonar interprets the
# intersection-with-optional-field as a no-op widening; for runtime
# assignability that's true, but for destructuring's typechecking it isn't.
sonar.issue.ignore.multicriteria.s4325AuthManager.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.s4325AuthManager.resourceKey=packages/auth/src/auth-manager.ts

sonar.issue.ignore.multicriteria.s4325Restore.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.s4325Restore.resourceKey=packages/auth/src/connect/restore.ts

# S7786: "`new Error()` is too unspecific for a type check. Use
# `new TypeError()` instead."
#
# The `assertConnect*` validators throw plain `Error` on JWT-payload
# shape mismatch via a shared `fail(context, field, reason)` helper.
# Sonar would prefer `TypeError`, which is semantically defensible — the
# failures are runtime type-shape mismatches. We keep `Error` deliberately
# so the boundary-validation errors propagate through the same error
# pipeline as every other connect-flow failure and downstream `catch`
# blocks don't need to special-case a TypeError subclass. Ignore the rule
# for this file only.
sonar.issue.ignore.multicriteria.s7786ConnectProtocol.ruleKey=typescript:S7786
sonar.issue.ignore.multicriteria.s7786ConnectProtocol.resourceKey=packages/agent/src/enbox-connect-protocol.ts
