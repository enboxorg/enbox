# Fly.io configuration for enbox Web Wallet (static PWA)
# See https://fly.io/docs/reference/configuration/ for reference

app = "enbox-web-wallet"
primary_region = "iad"

[build]
  dockerfile = "deploy/web-wallet/Dockerfile"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
